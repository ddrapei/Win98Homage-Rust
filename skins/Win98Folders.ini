; ===========================================================================
;  Win98 Folders  --  widget skin
;  Folders of the user's own choosing, each a Windows icon with its name
;  under it, in a white pane like the large icons of an Explorer window.  A
;  click selects one; a double-click opens it in Explorer.  Same warm golden
;  / orange-brown scheme and chrome as the sibling widgets.
;
;  One file, three skins.  build.rs compiles it once for each shape, giving
;  Cols and FrameW their own values each time:
;
;    folders_2    one column  of two folders   120 x 190
;    folders_4    two columns of two           190 x 190
;    folders_6    three columns of two         262 x 190
;
;  so everything below is laid out from those two, and the values given here
;  are only the four's.  Every shape is as tall as Weather, Disk Space and
;  Battery, so that it stands in a row with them; the two is as wide as the
;  Battery and the four is Disk Space's square.  The spots are numbered down
;  each column before the next -- 1 and 2, then 3 and 4, then 5 and 6 -- so a
;  shape grows by a column on the right and no folder moves.
;
;  It is the one widget whose title is the user's: "Folders" until another is
;  typed for it, so that each of them -- there can be as many as are asked
;  for -- can name the group of folders it holds.
;
;  Structure:
;    Variables      palette, the pane and its cells, the icons a folder can
;                   be given, the shape remembered
;    Styles         shared text and button options
;    Chrome         frame, title bar, folder icon, title (or the field it is
;                   being typed in), buttons
;    Pane           the sunken white pane, and one cell for each folder,
;                   which folders.rs draws: the icon and its name, the name
;                   being typed, or the empty spot
;
;  The icons are Windows' own, 32 x 32 in 256 colours, and keep their
;  colours whatever the tint: the folders are yellow in every colour.  What
;  the tint turns is the selection -- the dither over a selected icon and the
;  block behind its name -- which is in the title bar's brown, as a Win98
;  desktop has it in its highlight colour.
;
;  Performance: nothing runs while nobody touches it -- no timer, no frames.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208
; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are, and so do the pane and its ink
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink TitleInk IconFace EmptyInk

; --- the shape -------------------------------------------------------------
; build.rs gives Cols and FrameW the values of each shape (see the top).  The
; frame is FrameW x FrameH, and the pane fills it under the title bar.
Cols=2
FrameW=190
FrameH=190

; --- the pane and its cells ------------------------------------------------
; The inside of the pane's sunken edge is at x 8, y 29 of the frame, PaneW x
; 153; it holds two rows of cells, CellW x CellH each.  In a cell, the icon
; is centred across it IconY px down, and the name is centred under it,
; LabelY px down -- 2 px under the icon, as on a Win98 desktop: at most two
; lines of LineH px, no wider than LabelW, as a Win98 desktop wraps an icon's
; name -- cut short with "..." if it runs on.  IconY is what centres the
; rows in the pane: the icons start as far below its top edge as a one-line
; name in the bottom row ends above its foot, 16 px each.  A name of two
; lines, and its block when it is selected, still ends inside its cell.
PaneW=(#FrameW# - 16)
CellW=(#PaneW# / #Cols#)
CellH=76
IconY=16
LabelY=50
LabelW=74
LineH=13
; a selected folder: its icon dithered half and half with SelectBg, its name
; on a block of SelectBg in SelectInk.  The name's block reaches LabelPad px
; past its widest line either side
SelectBg=#TitleA#
SelectInk=#TitleInk#
LabelPad=2
; an empty spot: a dotted square where the icon would be, and "Choose
; folder" under it, both in EmptyInk
EmptyInk=#Shadow#
; The name being typed: a field one line tall where the name was, with a
; line of Ink round it.  Its text sits CityInset px in from either side and
; CityDrop px down, as the city fields' does.
CityInset=2
CityDrop=1

; --- the icons a folder can be given ---------------------------------------
; In the order the right-click menu's Icon list has them: the file in
; skins/Icons/Folders (without its .ico) and what the menu calls it.  The
; first is what a folder gets when it is chosen.  build.rs decodes each, its
; 32 px image and its 16 px one; another line here is another choice.
IconChoice1=folder, Folder
IconChoice2=folder_open, Open folder
IconChoice3=briefcase, Briefcase
IconChoice4=documents, My Documents
IconChoice5=pictures, My Pictures
IconChoice6=favorites, Favorites
IconChoice7=programs, Programs
IconChoice8=internet, Internet
IconChoice9=web, Web folder
IconChoice10=ftp, FTP
IconChoice11=channels, Channels
IconChoice12=search, Search
IconChoice13=history, History
IconChoice14=tasks, Scheduled Tasks
IconChoice15=computer, Computer
IconChoice16=network, Network
IconChoice17=dialup, Dial-up
IconChoice18=shared, Shared
IconChoice19=fonts, Fonts
IconChoice20=control, Control Panel
IconChoice21=tools, Tools
IconChoice22=settings, Settings
IconChoice23=printers, Printers

; --- the title -------------------------------------------------------------
; What the title bar says until another title is typed for it.  A title too
; long for the bar is cut short with "...".  While one is being typed, it is
; in a field in the bar, as a folder's name is typed in the pane.
Title=Folders

; --- remembered between runs -----------------------------------------------
; folders.rs keeps these in settings.ini under each widget's own section,
; [Folders], [Folders2], ..., starting from the values here: the shape, 2, 4
; or 6; the title typed for it (Title, empty for the one above); and for
; each spot n its folder (Pathn), its icon (Iconn, a file named above) and
; the name typed for it (Namen, empty for the folder's own)
Shape=4

; --- written by folders.rs -------------------------------------------------
; 1 while the title is being typed: the field is drawn instead of the title
TitleEdit=0

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

[StyleCell]
; one folder's place in the pane, drawn whole by folders.rs (each cell is an
; Image meter, the kind the program draws itself).  Its W and H are what a
; repaint of one folder is limited to, and what a click has to land in.  A
; click selects the folder, a double-click opens it -- or, on an empty spot,
; asks for a folder
W=#CellW#
H=#CellH#

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(#FrameW# + 2 * #Pad#),(#FrameH# + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,#FrameW#,#FrameH# | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,#FrameW#,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,#FrameH# | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,(#FrameH# - 1),#FrameW#,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle (#FrameW# - 1),0,1,#FrameH# | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,(#FrameW# - 2),1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,(#FrameH# - 2) | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,(#FrameH# - 2),(#FrameW# - 2),1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle (#FrameW# - 2),1,1,(#FrameH# - 2) | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,(#FrameW# - 6),18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; a folder: an inked outline with its tab up at the left, the tab in the
; accent and the body pale.  Drawn on x 6..17, y 5..14 like the Disk Space's
; drive, and nudged the same +2 right and +2 down as the siblings' icons.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 7,5,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 6,6,12,9 | Fill Color #Ink# | StrokeWidth 0
Shape3=Rectangle 7,6,4,1 | Fill Color #Accent2# | StrokeWidth 0
Shape4=Rectangle 7,7,10,7 | Fill Color #IconFace# | StrokeWidth 0
Shape5=Rectangle 7,7,10,1 | Fill Color #Accent2# | StrokeWidth 0

[MeterTitle]
; the title typed for it, or "Folders", in TitleInk and bold like every
; widget's, drawn by folders.rs: as far as 4 px short of the ? button, and
; cut short with "..." -- three stops, as Win98 cut a title -- if it runs on
; past that.  An Image meter because that is the kind the program draws
; itself; its W is the room the title has.
Meter=Image
X=(#Pad# + 24)
Y=(#Pad# + 6 + #TextDY#)
W=(#FrameW# - 70)
H=14
Hidden=#TitleEdit#

[MeterTitleField]
; while the title is being typed, the field it is typed in, drawn by
; folders.rs: a line of Ink round a white box, in the title bar from just
; left of where the title starts to 3 px short of the ? button, the typing
; starting where the title does.  The meter is the box with its line.
Meter=Image
X=(#Pad# + 21)
Y=(#Pad# + 4)
W=(#FrameW# - 66)
H=16

[MeterBtnHelp]
; 42 px in from the right, where every other widget with a ? has its own
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + #FrameW# - 42)
Y=(#Pad# + 5)
Shape10=Rectangle 6,3,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 9,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 5,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 9,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 8,6,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 7,7,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 7,8,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 7,10,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=About()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + #FrameW# - 23)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Pane -----------------------------------------------------------------

[MeterPane]
; the same two-ring sunken edge as the siblings' fields (2px per side), 4 px
; of bare face inside the frame's bevel to the left, the right and below, and
; 5 under the title bar, as the Photo Frame's pane has.  White, as an
; Explorer window's icons stand on white.  A click on it, off every folder,
; selects none.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 6,27,(#FrameW# - 12),157 | Fill Color #FieldBg# | StrokeWidth 0
Shape2=Rectangle 6,27,(#FrameW# - 12),1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,27,1,157 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,183,(#FrameW# - 12),1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle (#FrameW# - 7),27,1,157 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 7,28,(#FrameW# - 14),1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 7,28,1,155 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 7,182,(#FrameW# - 14),1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle (#FrameW# - 8),28,1,155 | Fill Color #Light# | StrokeWidth 0
LeftMouseUpAction=Select(0)

; The cells, down each column and then on to the next.  A shape with fewer
; columns hides those it has no room for.

[MeterCell1]
Meter=Image
MeterStyle=StyleCell
X=(#Pad# + 8)
Y=(#Pad# + 29)
LeftMouseUpAction=Select(1)
LeftMouseDoubleClickAction=Open(1)

[MeterCell2]
Meter=Image
MeterStyle=StyleCell
X=(#Pad# + 8)
Y=(#Pad# + 29 + #CellH#)
LeftMouseUpAction=Select(2)
LeftMouseDoubleClickAction=Open(2)

[MeterCell3]
Meter=Image
MeterStyle=StyleCell
X=(#Pad# + 8 + #CellW#)
Y=(#Pad# + 29)
Hidden=(#Cols# = 1)
LeftMouseUpAction=Select(3)
LeftMouseDoubleClickAction=Open(3)

[MeterCell4]
Meter=Image
MeterStyle=StyleCell
X=(#Pad# + 8 + #CellW#)
Y=(#Pad# + 29 + #CellH#)
Hidden=(#Cols# = 1)
LeftMouseUpAction=Select(4)
LeftMouseDoubleClickAction=Open(4)

[MeterCell5]
Meter=Image
MeterStyle=StyleCell
X=(#Pad# + 8 + 2 * #CellW#)
Y=(#Pad# + 29)
Hidden=(#Cols# = 1) + (#Cols# = 2)
LeftMouseUpAction=Select(5)
LeftMouseDoubleClickAction=Open(5)

[MeterCell6]
Meter=Image
MeterStyle=StyleCell
X=(#Pad# + 8 + 2 * #CellW#)
Y=(#Pad# + 29 + #CellH#)
Hidden=(#Cols# = 1) + (#Cols# = 2)
LeftMouseUpAction=Select(6)
LeftMouseDoubleClickAction=Open(6)
