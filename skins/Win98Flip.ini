; ===========================================================================
;  Win98 Flip Clock  --  widget skin
;  The time on cards that turn over, as a bedside clock of the seventies kept
;  it, and the one widget with no window round it: the clock is an object on
;  the desktop -- a plastic case in the gauges' warm grey, its rim rounded,
;  with the cards set into a dark recess in its front and the day printed
;  over them.  There is a card for each
;  figure, split across the middle into two leaves on a hinge, and on the
;  minute the top leaf of a card that changes falls forwards and down.  The
;  colons are no cards -- nothing there turns -- only dots in the recess.
;
;  It is drawn as the Battery and the Claude Usage gauges are, in the same
;  light: a pixel at a time, from the upper left and a little in front, each
;  surface in the step of light it is turned to -- the case's rim, the walls
;  of the recess, the bevelled edges of every leaf, the pins they turn on,
;  and a leaf on its way over, whose face turns to the floor as it falls and
;  whose back comes down in the light -- and the leaves round it, which move
;  too: the next one coming up into place, those below swinging as it lands.
;
;  Structure:
;    Variables      the case's and the cards' measures, the steps of light
;                   each material is drawn in, program-written state
;    Styles         shared text options
;    Clock          the case and the cards, drawn whole by flip.rs
;    Date           the day printed on the case, and AM or PM
;
;  The clock comes in two widths, from this one file: four cards, and -- with
;  Seconds on -- six, the second colon between the last two.  build.rs gives
;  Cards and CardsW their own values each time, and the case is laid out
;  round them.
;
;  There is no accent colour: the case is the gauges' grey, the cards paper and ink,
;  so a tint picked in the menu changes nothing here.  The widget is moved by
;  dragging anywhere on it, and its menu is a right-click anywhere on it.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; The nothing round the whole window, as every widget has: room to grab it by.
Pad=12
; The cards: CardW x CardH, CardGap apart, with ColonW for a colon.  CardH is
; two leaves and the seam between them, so it is odd: 25 + 1 + 25.  Under
; each card Stack rows of the leaves that have fallen show their edges.
CardH=51
CardW=34
ColonW=12
CardGap=3
Stack=2
; Four figures or six, and the width they and their colons come to:
; 4 * 34 + 12 + 4 * 3, and 6 * 34 + 2 * 12 + 7 * 3.  build.rs says which.
Cards=4
CardsW=160
; The case, from its outside in: the rim, rounded over Rim px; the flat of
; its front, CaseMargin wide at the sides and the foot and Strip deep over
; the recess, where the day is printed; the wall going down into the recess,
; Wall px; and the floor of the recess, Inset px clear of the cards all
; round.  CaseR and RecessR round the corners.
Rim=5
CaseMargin=5
Strip=16
Wall=2
Inset=4
CaseR=9
RecessR=4
CaseW=(2 * (#Rim# + #CaseMargin# + #Wall# + #Inset#) + #CardsW#)
CaseH=(#Rim# + #Strip# + 2 * (#Wall# + #Inset#) + #CardH# + #Stack# + #CaseMargin# + #Rim#)
WinW=(2 * #Pad# + #CaseW#)
WinH=(2 * #Pad# + #CaseH#)
; The shadow the recess's top and left walls cast on its floor, Cast px.
Cast=4
; the day's line, printed on the strip over the recess, and AM or PM at its
; right-hand end
DateX=(#Pad# + #Rim# + #CaseMargin# + 1)
DateY=(#Pad# + #Rim# + 1)
AmPmX=(#Pad# + #CaseW# - #Rim# - #CaseMargin# - 1)

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
Accent2=170,78,28
; the colour the accents are drawn around.  The flip clock has none: every
; colour below is left out of the tint
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink Case* Paper* Metal* Recess* Seam CardInk

; --- the steps of light ----------------------------------------------------
; Each material is drawn in six steps, lightest first, as the gauges' metal
; is: 0 a glint, facing the light square; 1 shine; 2 a lighter stretch --
; what a flat front, square to the eye, is in; 3 its own colour; 4 shade; 5
; the edge turned furthest away.  Rim is the light thrown back at the far
; edge of a rounded one, a little lighter than the edge.
;
; the case: the same warm greys as the Claude gauges' bezels and the
; Battery's metal ends -- Hilite, Light and Shadow and the steps between --
; so that it is of a piece with them
Case0=242,238,231
Case1=#Hilite#
Case2=210,199,178
Case3=#Light#
Case4=157,145,125
Case5=#Shadow#
CaseRim=152,141,121
; the cards: paper, whiter than the case
Paper0=255,255,255
Paper1=251,249,243
Paper2=242,237,225
Paper3=224,215,196
Paper4=198,186,163
Paper5=152,140,118
PaperRim=184,172,150
; the pins the leaves turn on: the chrome's warm metal, as the gauges' is
Metal0=242,238,229
Metal1=222,213,195
Metal2=210,199,178
Metal3=197,184,161
Metal4=157,145,125
Metal5=116,105,88
MetalRim=160,149,128
; the recess: the gauges' dark face, its floor in the walls' shadow a step
; darker, and the gap between the leaves of a card darker again
Recess=44,39,33
RecessCast=31,27,23
Seam=18,15,12
; the figures
CardInk=#Ink#

; --- written by flip.rs ------------------------------------------------------
; the day, and AM or PM on the 12-hour clock (the Date/Time widget's choice)
DateText=
AmPm=

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

; ---- Clock ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to the case and the Pad round it.  Alpha 1
; keeps the margin drag-able without being visible -- this widget has no
; frame to take hold of
Meter=Shape
Shape=Rectangle 0,0,#WinW#,#WinH# | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterClock]
; the case and the cards: everything flip.rs draws.  An Image
; meter because that is the kind the program draws itself.  It is the whole
; window, but a turning card repaints its own few px of it and no more
Meter=Image
X=0
Y=0
W=#WinW#
H=#WinH#

; ---- Date ----------------------------------------------------------------

[MeterDate]
; the day, printed in ink on the strip of the case over the recess
Meter=String
MeterStyle=StyleText
X=#DateX#
Y=(#DateY# + #TextDY#)
Text=#DateText#

[MeterAmPm]
; AM or PM on the 12-hour clock, at the strip's right-hand end; empty on the 24
Meter=String
MeterStyle=StyleText
X=#AmPmX#
Y=(#DateY# + #TextDY#)
StringAlign=Right
Text=#AmPm#
