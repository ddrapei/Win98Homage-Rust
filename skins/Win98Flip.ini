; ===========================================================================
;  Win98 Flip Clock  --  widget skin
;  The time on cards that flip, as a bedside clock of the seventies kept it:
;  a card for each figure, split across the middle, and on the minute the
;  top half of a card falls over to show the next.  The day is written over
;  the cards.  The frame is 190 x 114 -- the Rain Window's width and the
;  Resource Meter's height -- in the same warm golden / orange-brown chrome
;  as all of them.
;
;  Structure:
;    Variables      palette, the cards' measures and colours, the icon's
;    Styles         shared text options
;    Chrome         frame, title bar, icon, title, buttons
;    Date           the day, and AM or PM on the 12-hour clock
;    Slot           the sunken bezel, and the one meter flip.rs draws in
;
;  Every card is drawn by flip.rs into [MeterCards], still or turning: the
;  figures are its own pixel font, and the light a falling leaf is in is a
;  step down the Card0..Card4 ramp below, never a blend.  So the cards are
;  restyled from here, as the rain is.
;
;  The cards are paper, not accent: they stay cream and ink whatever tint is
;  picked.  Only the title bar follows it.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are, and so do the cards and the icon
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink TitleInk Ico*

; --- the slot ----------------------------------------------------------------
; The inside of the sunken bezel, x 8..181 by y 45..105 of the frame: what
; flip.rs draws in, cards and all.  [MeterSlot] and [MeterCards] are both
; laid out from these four.
SlotX=8
SlotY=45
SlotW=174
SlotH=61
; what shows between the cards
Slot=#Shadow#

; --- the cards ---------------------------------------------------------------
; Four figure cards and the colon's narrow one, CardGap apart, the first
; CardX in from the slot's left and all of them CardY down from its top.
; CardH is two leaves and the seam between them, so it is odd: 25 + 1 + 25.
; The figures are 18 x 30, centred on the card with the seam between their
; 15th and 16th rows -- the seam hides none of a figure.
CardX=7
CardY=4
CardW=34
CardH=51
ColonW=12
CardGap=3
; The card's colours, lightest first.  A leaf's face is Card0 and its lower
; and right-hand edges Card2; a leaf turned away from the light is drawn a
; step or two down the ramp, and so is the shadow one throws.
Card0=#FieldBg#
Card1=#Hilite#
Card2=#Light#
Card3=#Shadow#
Card4=#DkShadow#
CardInk=#Ink#
; the seam between the leaves, the line under each card, and the pins the
; leaves turn on, which stand out at either end of the seam
Seam=#DkShadow#
PinLight=#Hilite#
PinFace=#Light#
PinDark=#DkShadow#

; --- icon palette ------------------------------------------------------------
; the title-bar icon is pixel art in the Win98 icon idiom: flat VGA fills and
; a hard black outline, as the countdown's hourglass has, and it keeps them
; whatever the tint
IcoOutline=0,0,0
IcoWhite=255,255,255
IcoCap=192,192,192

; --- written by flip.rs ------------------------------------------------------
; the day over the cards, and AM or PM on the 12-hour clock (the Date/Time
; widget's choice)
DateText=
AmPm=

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(190 + 2 * #Pad#),(114 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,190,114 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,190,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,114 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,113,190,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 189,0,1,114 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,188,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,112 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,112,188,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 188,1,1,112 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,184,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; two flip cards, "1" and "2", as a Win98 title-bar icon: a hard black
; outline, the top leaves white and the bottom ones grey, the seam a black
; line across.  Each card is 7 x 13, two px apart; one rectangle per run of
; same-coloured pixels, in grid coordinates, placed so its 13 rows sit
; centred in the bar's 18.
Meter=Shape
X=(#Pad# + 4)
Y=(#Pad# + 5)
Shape=Rectangle 1,1,5,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape2=Rectangle 0,2,1,11 | Fill Color #IcoOutline# | StrokeWidth 0
Shape3=Rectangle 6,2,1,11 | Fill Color #IcoOutline# | StrokeWidth 0
Shape4=Rectangle 1,13,5,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape5=Rectangle 1,2,5,5 | Fill Color #IcoWhite# | StrokeWidth 0
Shape6=Rectangle 0,7,7,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape7=Rectangle 1,8,5,5 | Fill Color #IcoCap# | StrokeWidth 0
Shape8=Rectangle 3,3,1,4 | Fill Color #IcoOutline# | StrokeWidth 0
Shape9=Rectangle 2,4,1,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape10=Rectangle 3,8,1,3 | Fill Color #IcoOutline# | StrokeWidth 0
Shape11=Rectangle 2,11,3,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape12=Rectangle 10,1,5,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape13=Rectangle 9,2,1,11 | Fill Color #IcoOutline# | StrokeWidth 0
Shape14=Rectangle 15,2,1,11 | Fill Color #IcoOutline# | StrokeWidth 0
Shape15=Rectangle 10,13,5,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape16=Rectangle 10,2,5,5 | Fill Color #IcoWhite# | StrokeWidth 0
Shape17=Rectangle 9,7,7,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape18=Rectangle 10,8,5,5 | Fill Color #IcoCap# | StrokeWidth 0
Shape19=Rectangle 11,3,3,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape20=Rectangle 13,4,1,2 | Fill Color #IcoOutline# | StrokeWidth 0
Shape21=Rectangle 12,6,1,1 | Fill Color #IcoOutline# | StrokeWidth 0
Shape22=Rectangle 11,8,1,3 | Fill Color #IcoOutline# | StrokeWidth 0
Shape23=Rectangle 11,11,3,1 | Fill Color #IcoOutline# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 24)
Y=(#Pad# + 6 + #TextDY#)
FontColor=#TitleInk#
StringStyle=Bold
Text=Flip Clock

[MeterBtnHelp]
; 42 px in from the right, where every other widget with a ? has its own
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 148)
Y=(#Pad# + 5)
Shape10=Rectangle 6,3,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 9,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 5,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 9,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 8,6,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 7,7,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 7,8,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 7,10,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=About()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 167)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Date -----------------------------------------------------------------

[MeterDate]
; the day, a reading on the face: the Resource Meter's labels stand the same
; 6 rows under the title bar, over their fields' left edge
Meter=String
MeterStyle=StyleText
X=(#Pad# + 6)
Y=(#Pad# + 27 + #TextDY#)
Text=#DateText#

[MeterAmPm]
; AM or PM on the 12-hour clock, over the slot's right edge; empty on the 24
Meter=String
MeterStyle=StyleText
X=(#Pad# + 184)
Y=(#Pad# + 27 + #TextDY#)
StringAlign=Right
Text=#AmPm#

; ---- Slot -----------------------------------------------------------------

[MeterSlot]
; the siblings' two-ring sunken edge, 4 px of bare face inside the frame's
; bevel on three sides, as the Rain Window's pane has, and filled with what
; shows between the cards -- so it reads as the clock's housing even before
; flip.rs has drawn a card in it
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 6,43,178,65 | Fill Color #Slot# | StrokeWidth 0
Shape2=Rectangle 6,43,178,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,43,1,65 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,107,178,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 183,43,1,65 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 7,44,176,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 7,44,1,63 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 7,106,176,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 182,44,1,63 | Fill Color #Light# | StrokeWidth 0

[MeterCards]
; the cards: everything inside the bezel, drawn whole by flip.rs.  An Image
; meter because that is the kind the program draws itself; its W and H are
; what a repaint of a turning card is limited to, so none of the chrome
; around it is touched while a card falls.
Meter=Image
X=(#Pad# + #SlotX#)
Y=(#Pad# + #SlotY#)
W=#SlotW#
H=#SlotH#
