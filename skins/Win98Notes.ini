; ===========================================================================
;  Win98 Sticky Note  --  widget skin
;  A Windows 98 note window: a sheet of paper in a sunken field, a real
;  scrollbar, checkboxes you can click, and text you type straight onto.
;  Sibling of the Win98 Resource Meter and Date/Time skins: same warm
;  golden / orange-brown chrome, half their width.  Notes.txt is what the
;  skin shows.
;
;  Structure:
;    Variables      palette, layout knobs, program-written state
;    Styles         shared text, button and arrow options
;    Chrome         frame, title bar, icon, title, buttons
;    Paper          field bezel, the sheet, margin rule
;    Stamps         what the sheet is printed with: rule, checkbox, tick
;    Scrollbar      trough, arrows, thumb
;    Mouse          the one rectangle every click on the paper lands in
;    Status         two sunken panels at the foot: created, word count
;
;  One picture.  The note looks the same whether or not it is being typed
;  on, because it is the same drawing: [MeterSheet] is the twelve rows of
;  the sheet, drawn by notes.rs -- for each row its rule, its checkbox, its
;  words and the line through a done item -- and typing adds only a caret
;  and a selection on top.  Nothing is laid over the paper and nothing on it
;  moves when you click in.  (It used to be two pictures: rows of text for
;  reading, and a Windows edit box put over them for typing, which broke
;  lines elsewhere, showed the brackets and hid the checkboxes.)
;
;  Typing.  A click on the text puts the caret there; drag to select,
;  double-click for a word.  Clicking anywhere else -- the desktop, another
;  window, the rest of this skin -- saves and finishes, and so does Escape.
;  The keys are the ones you already know: arrows, Home and End, Ctrl with
;  them for a word or the whole note, Shift to select, Ctrl-A, Ctrl-C/X/V,
;  Ctrl-Z and Ctrl-Y, Ctrl-Backspace.  The wheel and the scrollbar move the
;  sheet without ending the typing.
;
;  Checkboxes.  A line of the file that opens with [ ] or [x] is an item.
;  The brackets are never shown: a checkbox in the margin stands for them,
;  and a click on it ticks or unticks the item, typing or not.  Typing [ ]
;  at the start of a line makes one, Enter on an item starts the next (and
;  on an empty one ends the list), and Backspace at the start of an item
;  takes its checkbox away.  A line beginning # is text like any other: the
;  window is called Notes and nothing in the file changes that.
;
;  Saving.  There is no save key because there is nothing to remember: the
;  typing is written a second after it pauses, and again when it finishes,
;  however it comes to finish.  Notes.txt.bak holds the note as it was
;  before the latest spell of typing.  If the file cannot be written the
;  right panel says "not saved", the sheet goes on showing what was typed,
;  and the write is tried again every couple of seconds; until it works the
;  file is not read back, so the typing wins over anything else that
;  changes the note meanwhile -- and that other version is what goes into
;  the .bak.
;
;  Characters.  The note is UTF-8, so it can hold any language, and the rows
;  are measured with the font they are drawn in, so they break where the
;  words stop fitting whatever the alphabet.  An older note written in
;  Windows-1252 reads as it always did, and the first edit writes it back
;  as UTF-8.
;
;  Clicking.  Two meters report a mouse position -- [MeterPaper] for the
;  sheet and [MeterTrough] for the scrollbar -- and both are handed the
;  pointer's x and y relative to THE METER, not to the skin.  Neither
;  meter sits at the skin's origin, so the program has to add the meter's own
;  corner back before the number means anything.  It does that from
;  #PaperX#/#PaperY# and #TroughY#, the same variables the meters are placed
;  with, so the two cannot hold different figures.  Getting this wrong is
;  silent -- a wrong offset still picks a row, just not the one under the
;  pointer -- which is what it once did.  (A press on the text does not come
;  through a meter at all: the window hands it to notes.rs as it lands,
;  which takes #Pad# off itself.)
;
;  The frame is 190 wide against the sibling's 380, which leaves the text
;  column 146 px -- about twenty-six characters.  notes.rs wraps the file to
;  that column, shows twelve rows of it at a time, and moves the thumb.
;
;  Performance: nothing changes unless the file, the scroll offset, a
;  checkbox, the paper or the typing does, so a note nobody is touching
;  costs one small file read every other tick and no repaint at all.  While
;  it is typed on, the blinking caret repaints its own thirteen pixels.
; ===========================================================================

[Widget]
; the wheel scrolls anywhere over the skin, not just over the paper
MouseScrollUpAction=Scroll(-1)
MouseScrollDownAction=Scroll(1)

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the Win98 Resource Meter and Date/Time skins: change them
; together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208

; --- paper stock -----------------------------------------------------------
; The two papers the swatch button swaps between.  This is the only place
; they are written down -- notes.rs reads them from here, so the swatch and
; the sheet cannot disagree.
; canary
Paper1=250,238,190
; white
Paper2=247,243,233

; the margin rule stays the same warm red on either paper, the way a printed
; margin does whatever shade the sheet is
NoteMargin=205,128,96
; and so do the ruled lines, for a sheet that has them
NoteRule=#Light#

; --- typing ----------------------------------------------------------------
; What is selected is drawn light on dark, in the title bar's own brown: this
; palette's answer to Win98's white on navy.
SelectBg=#TitleA#
SelectInk=#TitleInk#
; ms of quiet before the typing is written; 0 writes only when it finishes
AutoSave=1000

; --- note ------------------------------------------------------------------
; The file the skin shows, and the figures notes.rs needs to lay it out:
; 12 rows starting at y 30, 13 px apart, each drawn from x 22 and wrapped to
; 146 px, with the scrollbar's trough running from y 40 for 136 px.  The static
; meters below are laid out from the same figures, so change them together.
NoteFile=Notes.txt
Rows=12
RowPitch=13
Row1Y=30
TextX=22
TextW=146
TroughX=171
TroughY=40
TroughH=136

; The sheet's own rectangle, and the reason it is written down here rather
; than inside the meter that draws it.  [MeterPaper] is the one thing in the
; skin that reports a mouse position, and the pointer's x and y arrive
; relative to the meter that took the click -- so whatever corner it is placed
; at, notes.rs has to add back before it can say which row was clicked.  Both
; read it from here, so neither can be holding a different number from the
; other.  That is not a hypothetical: they did, and every checkbox in the note
; answered three rows above the pointer.
PaperX=8
PaperY=29
PaperW=163
PaperH=158

; where the title sits in the bar: up to the first of the three buttons
TitleX=24
TitleY=6
TitleW=106

; --- remembered between runs -----------------------------------------------
; notes.rs keeps these three in settings.ini, starting from the values here,
; so the note keeps its paper and its birthday across a restart or a reboot.
; Created is blank until the first run stamps it; put any date you like
; here and the skin will show that instead.
Colour=1
; 1 = ruled paper, 0 = plain
Ruled=0
Created=30 Jul 2026

; --- written by notes.rs ---------------------------------------------------
; The defaults are an empty yellow note with a dead scrollbar: without the
; program the window reads blank, not broken.
NoteBg=250,238,190
; the right-hand panel: how many words the note runs to
Words=
; the thumb fills the trough and both arrows are grey -- Win98's way of
; saying there is nothing to scroll
ThumbY=40
ThumbH=136
UpInk=#Shadow#
DownInk=#Shadow#
; the lines on the rule button: ink on a ruled sheet, shadow on a plain one
RuleInk=#Shadow#

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

[StyleArrow]
; the 11x11 outset of a scrollbar arrow.  The glyph is left to the meter
; because its colour changes: ink while there is somewhere to go, shadow
; when there is not
Shape=Rectangle 0,0,11,11 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,11,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,11 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,10,11,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 10,0,1,11 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,9,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,9 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,9,9,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 9,1,1,9 | Fill Color #Shadow# | StrokeWidth 0

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(190 + 2 * #Pad#),(220 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,190,220 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,190,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,220 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,219,190,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 189,0,1,220 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,188,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,218 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,218,188,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 188,1,1,218 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,184,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; a note torn off a pad: an inked page of #IconFace# with three ruled lines
; and a dog-eared corner.  Drawn on x 6..16, y 4..15 like the siblings'
; icons, and nudged the same +2 right and +2 down so its 12 rows sit
; centered in the bar's 18.  Double-click opens the file, for the edits
; that are easier in a text editor.  No tooltip on it, or on anything else
; here: nothing in this skin explains itself on hover.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 6,4,11,12 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 7,5,9,10 | Fill Color #IconFace# | StrokeWidth 0
Shape3=Rectangle 8,7,7,1 | Fill Color #Accent2# | StrokeWidth 0
Shape4=Rectangle 8,9,7,1 | Fill Color #Accent2# | StrokeWidth 0
Shape5=Rectangle 8,11,5,1 | Fill Color #Accent2# | StrokeWidth 0
Shape6=Rectangle 15,13,2,1 | Fill Color #Face# | StrokeWidth 0
Shape7=Rectangle 14,14,3,1 | Fill Color #Face# | StrokeWidth 0
Shape8=Rectangle 13,15,4,1 | Fill Color #Face# | StrokeWidth 0
Shape9=Rectangle 14,13,1,1 | Fill Color #Ink# | StrokeWidth 0
Shape10=Rectangle 13,14,1,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseDoubleClickAction=OpenFile()

[MeterTitle]
; the window's name.  It is the word Notes and nothing else -- not the file's
; first line, not anything a click can change -- so it carries no mouse
; action at all, and the whole bar drags the window the way a Win98 title bar
; should.
Meter=String
MeterStyle=StyleText
X=(#Pad# + #TitleX#)
Y=(#Pad# + #TitleY# + #TextDY#)
W=#TitleW#
H=13
ClipString=1
FontColor=#TitleInk#
StringStyle=Bold
Text=Notes

[MeterBtnRule]
; ruled paper or plain.  A small sheet like [MeterBtnPaper]'s -- the same
; inked 8x8 with 6x6 of #NoteBg# inside it -- with two lines across it, so
; the two buttons are told apart at a glance: this is the one about lines.
; The lines are #RuleInk#: ink while the paper is ruled, shadow while it is
; plain.  A click swaps one for the other.
;
; Three px of bar between it and the paper button, as between that and Close.
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 132)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,8,8 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,6,6 | Fill Color #NoteBg# | StrokeWidth 0
Shape12=Rectangle 5,6,6,1 | Fill Color #RuleInk# | StrokeWidth 0
Shape13=Rectangle 5,8,6,1 | Fill Color #RuleInk# | StrokeWidth 0
LeftMouseUpAction=ToggleRule()

[MeterBtnPaper]
; the paper colour, shown as a picture of the note itself rather than as a
; plain swatch: an inked 8x8 window with one row of #TitleB# title bar
; across the top and five of #NoteBg# paper under it.  So the button is a
; small copy of the thing it changes, and it still answers the only
; question it is there to answer -- what colour is the paper -- because
; five of its eight rows are that colour.  A click swaps it for the other.
;
; It sits at x 4, y 3 of the 16x14, which leaves 4 px of face either side
; and 3 above and below: equal margins on both axes.  Shape1..9 are the
; button's own bevel and come from [StyleButton]; everything here is
; inside it and touches none of it.
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 151)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,8,8 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,6,1 | Fill Color #TitleB# | StrokeWidth 0
Shape12=Rectangle 5,5,6,5 | Fill Color #NoteBg# | StrokeWidth 0
LeftMouseUpAction=NextPaper()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 170)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Paper ----------------------------------------------------------------
; The field is painted #NoteBg#, which notes.rs answers for: that is how the
; swatch button recolours the sheet.

[MeterField]
; the same two-ring sunken edge as the siblings' fields (2px per side), so
; the paper is 8..181 x 29..186
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 6,27,178,162 | Fill Color #NoteBg# | StrokeWidth 0
Shape2=Rectangle 6,27,178,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,27,1,162 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,188,178,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 183,27,1,162 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 7,28,176,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 7,28,1,160 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 7,187,176,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 182,28,1,160 | Fill Color #Light# | StrokeWidth 0

[MeterSheet]
; The sheet itself: twelve rows of the note, drawn by notes.rs.  Meter=Image
; is how a skin says "the program draws this" -- there is no picture file.
; It is placed at the frame's corner and covers the paper, x 8..170 by
; y 29..186; the drawing is kept inside the paper whatever it is given.
;
; For each row, in this order: its rule if the paper is ruled, its checkbox
; and tick, its words, the line through them if the item is done -- and,
; while the note is being typed on, the selection and then the caret.  The
; rule, the box and the tick are the three stamps below, put down once a
; row; where the rows go is #Row1Y# and #RowPitch#, where the words start is
; #TextX#, and how far they run is #TextW#.
Meter=Image
X=#Pad#
Y=#Pad#
W=(#PaperX# + #PaperW#)
H=(#PaperY# + #PaperH#)

[MeterMargin]
; the paper's printing: one margin rule down the left, at x 19, with the
; checkboxes sitting in the margin beside it.  After the sheet, so that it
; crosses the ruled lines rather than the other way about.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 19,29,1,158 | Fill Color #NoteMargin# | StrokeWidth 0

; ---- Stamps ---------------------------------------------------------------
; Three meters that are never drawn where they stand: Hidden=1 keeps the
; skin from drawing them, and notes.rs stamps each one onto the sheet a row
; at a time, #RowPitch# further down for every row.  Each is placed here
; where it goes on the FIRST row, so what a checkbox or a rule looks like,
; and where in its row it sits, is still written in the skin.

[MeterRule]
; a ruled line: the last pixel row of a row of text, from one edge of the
; sheet to the other.  Only stamped while the paper is ruled.
Meter=Shape
X=(#Pad# + #PaperX#)
Y=(#Pad# + #Row1Y#)
Hidden=1
Shape=Rectangle 0,12,#PaperW#,1 | Fill Color #NoteRule# | StrokeWidth 0

[MeterBox]
; an item's checkbox: 9x9, sunken, out in the margin beside the first row
; of its line.  Nothing but drawing -- the click that flips it lands on
; [MeterPaper], which works out from the click's x that it was over the
; margin and not the text.
Meter=Shape
X=(#Pad# + 9)
Y=(#Pad# + #Row1Y#)
Hidden=1
Shape=Rectangle 0,1,9,9 | Fill Color #FieldBg# | StrokeWidth 0
Shape2=Rectangle 0,1,9,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 0,1,1,9 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 0,9,9,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 8,1,1,9 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 1,2,7,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 1,2,1,7 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 1,8,7,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 7,2,1,7 | Fill Color #Light# | StrokeWidth 0

[MeterTick]
; the tick in it, for an item that is done: five 1px columns, measured from
; the same corner as the box they sit in
Meter=Shape
X=(#Pad# + 9)
Y=(#Pad# + #Row1Y#)
Hidden=1
Shape=Rectangle 2,5,1,2 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 3,6,1,2 | Fill Color #Ink# | StrokeWidth 0
Shape3=Rectangle 4,5,1,2 | Fill Color #Ink# | StrokeWidth 0
Shape4=Rectangle 5,4,1,2 | Fill Color #Ink# | StrokeWidth 0
Shape5=Rectangle 6,3,1,2 | Fill Color #Ink# | StrokeWidth 0

; ---- Scrollbar ------------------------------------------------------------

[MeterTrough]
; Win98 dithers a trough half face, half highlight; at this size the two
; average out to the palette's Light, so it is one flat rectangle.  A click
; in it pages towards the pointer, which is why Page() looks at the click's y
; -- and, as on the paper above, that y is relative to this meter, so Page()
; adds #TroughY# back before comparing it with the thumb.
Meter=Shape
X=(#Pad# + #TroughX#)
Y=(#Pad# + #TroughY#)
Shape=Rectangle 0,0,11,#TroughH# | Fill Color #Light# | StrokeWidth 0
LeftMouseUpAction=Page()

[MeterThumb]
; the moving part, written by notes.rs -- and only its top and its height:
; the outset that makes it a thumb is static, drawn around the two numbers
Meter=Shape
X=(#Pad# + #TroughX#)
Y=#Pad#
Shape=Rectangle 0,#ThumbY#,11,#ThumbH# | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,#ThumbY#,11,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,#ThumbY#,1,#ThumbH# | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,(#ThumbY# + #ThumbH# - 1),11,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 10,#ThumbY#,1,#ThumbH# | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,(#ThumbY# + 1),9,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,(#ThumbY# + 1),1,(#ThumbH# - 2) | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,(#ThumbY# + #ThumbH# - 2),9,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 9,(#ThumbY# + 1),1,(#ThumbH# - 2) | Fill Color #Shadow# | StrokeWidth 0

[MeterBarUp]
; one row per click, the same as the wheel
Meter=Shape
MeterStyle=StyleArrow
X=(#Pad# + #TroughX#)
Y=(#Pad# + #TroughY# - 11)
Shape10=Rectangle 5,3,1,1 | Fill Color #UpInk# | StrokeWidth 0
Shape11=Rectangle 4,4,3,1 | Fill Color #UpInk# | StrokeWidth 0
Shape12=Rectangle 3,5,5,1 | Fill Color #UpInk# | StrokeWidth 0
Shape13=Rectangle 2,6,7,1 | Fill Color #UpInk# | StrokeWidth 0
LeftMouseUpAction=Scroll(-1)

[MeterBarDown]
Meter=Shape
MeterStyle=StyleArrow
X=(#Pad# + #TroughX#)
Y=(#Pad# + #TroughY# + #TroughH#)
Shape10=Rectangle 2,3,7,1 | Fill Color #DownInk# | StrokeWidth 0
Shape11=Rectangle 3,4,5,1 | Fill Color #DownInk# | StrokeWidth 0
Shape12=Rectangle 4,5,3,1 | Fill Color #DownInk# | StrokeWidth 0
Shape13=Rectangle 5,6,1,1 | Fill Color #DownInk# | StrokeWidth 0
LeftMouseUpAction=Scroll(1)

; ---- Mouse ----------------------------------------------------------------

[MeterPaper]
; One transparent rectangle over the whole sheet, x 8..170 -- everything
; left of the scrollbar and nothing under it.  A click on the paper that is
; not on the text lands here and is handed to the program as a coordinate
; pair: it is in the margin, so flip that row's checkbox.  (A press on the
; text, from x 20 rightwards, never gets this far: notes.rs takes it as it
; lands, to put the caret there.)
;
; One meter instead of a hit area per row, and the rule about which part of
; a row does what is written once, in notes.rs, where it can be read.
;
; The pair handed over is relative to THIS METER, not to the skin, and that
; is the whole of what there is to get wrong here.  Click() adds
; #PaperX#/#PaperY# back, which is why they are variables up in [Variables]
; and why X and Y below are built from them rather than written out: the
; meter's corner and the program's idea of the meter's corner are then the
; same two numbers, read from one place.
;
; Note what this does NOT need.  #Pad# is in X and Y, so it has already been
; taken off by the time the click arrives.  If you find yourself adding or
; subtracting Pad in Click(), that is the bug: it cancels.
Meter=Shape
X=(#Pad# + #PaperX#)
Y=(#Pad# + #PaperY#)
Shape=Rectangle 0,0,#PaperW#,#PaperH# | Fill Color 0,0,0,1 | StrokeWidth 0
LeftMouseUpAction=Click()

; ---- Status ---------------------------------------------------------------

[MeterStatusBar]
; two panels, sunken a single ring the way a Win98 status bar is, and the
; same size as each other: 88 px each, from x 6 to x 183 with 2 px between
; them.  178 does not halve evenly, so the gap takes the odd pixel rather
; than one panel being a pixel wider than the other.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 6,195,88,16 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 6,195,88,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,195,1,16 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,210,88,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 93,195,1,16 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 96,195,88,16 | Fill Color #Face# | StrokeWidth 0
Shape7=Rectangle 96,195,88,1 | Fill Color #Shadow# | StrokeWidth 0
Shape8=Rectangle 96,195,1,16 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 96,210,88,1 | Fill Color #Hilite# | StrokeWidth 0
Shape10=Rectangle 183,195,1,16 | Fill Color #Hilite# | StrokeWidth 0

[MeterCreated]
; when the note was started: #Created#, which the first run stamps into
; settings.ini and every run after that just reads.
;
; The word "Created" is not shown.  Both panels are 88 px wide, which
; leaves 82 for text, and "Created 30 Jul 2026" wants 96 of it -- so the
; label would have pushed the date itself into an ellipsis.  A bare date
; beside a bare count is the more Win98 pairing anyway.  It was on a
; tooltip for a while; nothing in this skin explains itself on hover, so
; it isn't any more.
Meter=String
MeterStyle=StyleText
X=(#Pad# + 9)
Y=(#Pad# + 198 + #TextDY#)
W=82
H=13
ClipString=1
Text=#Created#

[MeterWords]
; how many words the note runs to -- and where the program says so if it
; could not write the file, cannot find it, or is holding text that has
; not been saved yet.
Meter=String
MeterStyle=StyleText
X=(#Pad# + 181)
Y=(#Pad# + 198 + #TextDY#)
W=82
H=13
ClipString=1
StringAlign=Right
Text=#Words#
