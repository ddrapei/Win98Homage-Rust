[MeterCity1]
; The city in its field, drawn by world.rs.  Meter=Image is how a skin says
; "the program draws this" -- there is no picture file.  It covers the inside
; of the field and nothing else, the #FieldBg# the two bevel rings enclose.
; A press in it is taken by world.rs, which is why there is no mouse action
; here: it needs the press, not the release, to put the caret where it
; landed and to follow a drag.
Meter=Image
X=(#Pad# + 23)
Y=(#Pad# + 116)
W=88
H=16

