; ===========================================================================
;  Win98 World Clock  --  widget skin
;  Three clocks in a row, each keeping the time of a city: the "Time" box of
;  the Date/Time skin three times over, at half its size.  As wide as the
;  Date/Time and Resource Meter skins -- a 380 px frame -- so it stacks edge
;  to edge with them.  Same warm golden / orange-brown scheme and chrome.
;
;  Structure:
;    Variables      palette, the three centres, program-written state
;    Styles         shared text, title-bar button and hand options
;    Chrome         frame, title bar, globe icon, title, buttons
;    Clocks         for each of the three: an etched group box with the day
;                   there and how far ahead it is on its edge, the ring, the
;                   ticks and the hands, the city in a field, the time in
;                   figures
;
;  A clock is the sibling's at half scale: the same ring of sixty dots and
;  twelve raised ticks, the same tapered hands with their shadows down and to
;  the right, no face behind them.  There is no second hand -- three of them
;  would be three repaints a second for nothing anybody reads -- so a clock
;  is drawn again once a minute.
;
;  The city.  Each field is typed on where it stands, exactly as the Weather
;  skin's is: a click selects the name that is there and gives the field the
;  keyboard; Enter, or a click anywhere else, takes what was typed, and
;  Escape leaves things as they were.  Open-Meteo's geocoder turns the name
;  into a place and the time zone it keeps, and world.rs keeps the two in
;  settings.ini as City1..3 and Zone1..3 -- the zone by the name Windows has
;  its rules under, so that summer time comes and goes there as it should.
;  Emptying a field puts its clock away.
;
;  A white sunken field says "you can type here", so the cities are the only
;  ones: the time in figures under each is plain text on the face.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole dialog, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
Accent3=204,124,56
IconFace=236,226,208
; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink TitleInk IconFace

; --- clocks ----------------------------------------------------------------
; The three group boxes are 114 px wide with 9 between them, from x 10 to
; x 370 of the frame, and each clock is centred in its box: CX1..3, all at
; CY.  The ring's dots are 31 px from the centre and the ticks 27; every
; shape of a clock below is placed from these figures, so they change
; together.
CX1=67
CX2=190
CX3=313
CY=74

; --- the city fields -------------------------------------------------------
; Where a name sits in [MeterCity1..3], the inside of each field: this many
; px in from either side, and its line this many px down from the top.  It
; is centred in what is left of the width.  What is selected of it is drawn
; light on dark, in the title bar's own brown -- as on the Weather skin.
CityInset=2
CityDrop=2
SelectBg=#TitleA#
SelectInk=#TitleInk#

; --- remembered between runs -----------------------------------------------
; world.rs keeps these six in settings.ini, starting from the values here.
; A city is what its field shows; its zone is the name of the time zone's key
; in the Windows registry.  Typing a city fills in both.
City1=London
Zone1=GMT Standard Time
City2=New York
Zone2=Eastern Standard Time
City3=Tokyo
Zone3=Tokyo Standard Time

; --- written by world.rs ---------------------------------------------------
; for each clock: the legend on its box ("Today, +7 hrs"), the time there in
; figures, the angles of its hands, and whether it has a city at all
Leg1=
Leg2=
Leg3=
Time1=
Time2=
Time3=
AngleHour1=0
AngleHour2=0
AngleHour3=0
AngleMin1=0
AngleMin2=0
AngleMin3=0
NoZone1=0
NoZone2=0
NoZone3=0

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

; The hands: the sibling's two, at half their length.  Each is a path drawn
; in an 80 x 80 meter with the clock's centre at 40,40, and turned about that
; point by the angle world.rs writes.  A shadow is the same path in a meter
; one px down and to the right.

[StyleHandHour]
HandHour=40,21 | LineTo 42,40 | LineTo 40,43 | LineTo 38,40 | ClosePath 1

[StyleHandMinute]
HandMinute=40,15 | LineTo 41.5,40 | LineTo 40,44 | LineTo 38.5,40 | ClosePath 1

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(380 + 2 * #Pad#),(166 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,380,166 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,380,1 | Fill Color #Light# | StrokeWidth 0
