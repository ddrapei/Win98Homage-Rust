Shape6=Rectangle 1,1,378,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,164 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,164,378,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 378,1,1,164 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,374,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; a globe: the sibling's clock face -- the same inked circle on x 6..17,
; y 4..15, nudged the same +2 right and +2 down -- with a meridian and the
; equator across it in the accent where the clock has its hands
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 10,4,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 8,5,8,1 | Fill Color #Ink# | StrokeWidth 0
