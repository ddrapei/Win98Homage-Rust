; ===========================================================================
;  Win98 Claude Usage  --  widget skin
;  How much of a Claude plan's two usage limits has been used: the current
;  session, which lasts five hours from its first message, and the current
;  week.  Each is a gauge in a group box of its own, side by side, after the
;  fuel gauge on a car's dashboard: a round dark face under glass in a
;  raised metal bezel, a scale of ten segments round it that light up from
;  green through yellow to red as far as the reading goes, a needle on the
;  reading itself, the percentage at the foot of the face, and under the
;  gauge how long until the limit resets.  The frame is 246 wide and 160
;  tall.  Same warm golden / orange-brown scheme and chrome as the sibling
;  widgets.
;
;  The figures are the ones Claude Code's /usage shows, asked for with the
;  sign-in Claude Code keeps (see claude.rs).  The widget never signs in, or
;  renews the sign-in, itself: when it has run out, the figures stay as they
;  were and the line under each gauge says "Signed out" until Claude Code has
;  signed in again.
;
;  Structure:
;    Variables      palette, the gauges' figures and colours, program-written
;                   state
;    Styles         shared text and title-bar button options
;    Chrome         frame, title bar, Claude Code icon, title, buttons
;    Limits panel   two etched group boxes, Session and Week, each with its
;                   legend on the edge, its gauge, the percentage and how
;                   long until the limit resets
;
;  The gauges are drawn as the Battery is, and in its light: a pixel at a
;  time, lit from the upper left and a little in front, each surface in the
;  shade of how far it is turned to the light -- a glint where it faces it
;  square, then shine, lighter, its own colour, shade and edge as it turns
;  away -- and nothing outlined.  The bezel is a ring of the chrome's metal,
;  rounded across, so its outer slope catches the light at the upper left
;  and its inner slope there is in shade, and the other way about at the
;  lower right.  The face is set in below it, and the bezel's shadow falls
;  into it at the upper left.  The segments of the scale are rounded across
;  as the bezel is, each standing in a groove, with its end that is turned
;  to the light catching it as the top of a Battery section does; those not
;  lit are dark, like the Battery's.  The needle is a ridge in the accent
;  colour, on a domed hub with a metal cap that has a glint on it, and the
;  two throw their shadow on the face down and to the right.  Over it all is
;  the glass, with a streak of light reflected on it just inside the bezel
;  at the upper left.  claude.rs draws all of it into [MeterSessionDial] and
;  [MeterWeekDial] from the figures and colours below.
;
;  Performance: the figures are asked for every five minutes by a child that
;  exits when it has them; in between, the only work is the reset times
;  moving on, once a minute.  A gauge is drawn again only when its needle
;  moves to another whole percent.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208
; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are, and so do the icon's and the gauges'
; colours below, but for the needle
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink TitleInk IconFace Ico* Dial*

; --- icon palette ------------------------------------------------------------
; the title-bar icon is Claude Code's little pixel creature, in its own
; orange with black eyes, flat as the siblings' icons are, and it keeps them
; whatever the tint
IcoBody=217,119,87
IcoEye=0,0,0

; --- the gauges ------------------------------------------------------------
; Each gauge is a picture DialD px square, its centre in the middle of it:
; the bezel is the circle that fills it, DialBezel px wide, and the face is
; inside that.  The scale is a band from ScaleIn to ScaleOut px from the
; centre, running ScaleSweep degrees round from the lower left over the top
; to the lower right -- as far either side of twelve o'clock -- and cut into
; Segments segments with SegmentGap px of groove between each two.  The
; needle reaches NeedleLen px from the centre, short of the scale, and is
; NeedleW px either side of its middle where it leaves the hub, narrowing to
; its tip.  The hub is HubR px across from its middle, and the metal cap on
; it CapR.  The session's gauge has its corner at SessionX, DialY of the
; frame and the week's at WeekX, DialY.
DialD=89
DialBezel=8
ScaleIn=23
ScaleOut=31
ScaleSweep=240
Segments=10
SegmentGap=2
NeedleLen=21
NeedleW=2.5
HubR=5
CapR=2
SessionX=20
WeekX=137
DialY=40
; The face, dark as a gauge's is; a segment that is not lit; and the
; scale's colours from nought to full: DialLow for the first segment,
; DialMid half way round and DialHigh for the last, and each segment between
; them a step of the way from one to the next -- the Battery's three, the
; other way about, so the more is used the redder it is.
DialFace=44,39,33
DialOff=70,63,54
DialLow=56,180,72
DialMid=250,204,44
DialHigh=226,40,36
; the needle and its hub: the accent, so they take the colour picked
Needle=#Accent2#
; How a segment is shaded from its own colour, as a Battery section is: this
; many percent of the way to white for its shine and the lighter stretch,
; and to black for the shade, the edge and the light thrown back at the far
; edge.  A segment not lit has less shine.  The end of a segment turned to
; the light is ScaleEnd percent lighter.
ScaleShine=55
ScaleLight=25
ScaleShade=22
ScaleEdge=42
ScaleRim=14
ScaleOffShine=16
ScaleOffLight=7
ScaleEnd=30
; How far towards black the groove the segments stand in is from the face,
; the bezel's shadow in the face, and the needle's on it; and towards white
; the streak of light on the glass.
DialGroove=15
DialRecess=35
DialCast=40
DialGlass=40

; --- written by claude.rs --------------------------------------------------
; the percentages, and how long until each limit resets -- or, while there
; is trouble, what it is.  The defaults read sensibly before the first answer
SessionPct=--
SessionReset=Loading...
WeekPct=--
WeekReset=Loading...

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StylePct]
; the percentage at the foot of a gauge's face: large, light on the dark
; face, centred on the gauge
FontSize=11
StringStyle=Bold
StringAlign=Center
FontColor=#Hilite#

[StyleReset]
; the line under a gauge, centred on it
StringAlign=Center

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(246 + 2 * #Pad#),(160 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,246,160 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,246,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,160 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,159,246,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 245,0,1,160 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,244,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,158 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,158,244,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 244,1,1,158 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,240,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; Claude Code's creature, a px a square of it: a body 8 wide and 6 tall
; with an arm 2 wide out to either side across its third and fourth rows,
; a black eye in its second row, one in from either side, and four legs 2
; rows long under it -- at its first, third, sixth and eighth columns.  12
; by 8 in all, drawn on x 6..17, y 6..13, so it stands in the middle of the
; 12 px square the siblings' icons are drawn in, and nudged the same +2
; right and +2 down.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 8,6,8,6 | Fill Color #IcoBody# | StrokeWidth 0
Shape2=Rectangle 6,8,12,2 | Fill Color #IcoBody# | StrokeWidth 0
Shape3=Rectangle 8,12,1,2 | Fill Color #IcoBody# | StrokeWidth 0
Shape4=Rectangle 10,12,1,2 | Fill Color #IcoBody# | StrokeWidth 0
Shape5=Rectangle 13,12,1,2 | Fill Color #IcoBody# | StrokeWidth 0
Shape6=Rectangle 15,12,1,2 | Fill Color #IcoBody# | StrokeWidth 0
Shape7=Rectangle 9,7,1,1 | Fill Color #IcoEye# | StrokeWidth 0
Shape8=Rectangle 14,7,1,1 | Fill Color #IcoEye# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 24)
Y=(#Pad# + 6 + #TextDY#)
FontColor=#TitleInk#
StringStyle=Bold
Text=Claude Usage

[MeterBtnHelp]
; as far in from the right as the 190 px widgets have theirs
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 204)
Y=(#Pad# + 5)
Shape10=Rectangle 6,3,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 9,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 5,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 9,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 8,6,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 7,7,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 7,8,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 7,10,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=About()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 223)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Limits panel ---------------------------------------------------------

[MeterBoxes]
; The two group boxes, side by side: the siblings' etched double ring -- a
; Shadow ring with a Hilite ring one px down-right of it -- with 8 px of
; bare face between the frame's bevel and either outer side, 8 between the
; two boxes, 9 between the title bar and the top line, and 5 below.  Each
; gauge stands 8 px in from its box's ring on either side, 8 under the top.
; The session's box: its ring 10..117 by 30..151.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 10,30,108,1 | Fill Color #Shadow# | StrokeWidth 0
Shape2=Rectangle 10,30,1,122 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 10,151,108,1 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 117,30,1,122 | Fill Color #Shadow# | StrokeWidth 0
Shape5=Rectangle 11,31,108,1 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 11,31,1,122 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 11,152,108,1 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 118,31,1,122 | Fill Color #Hilite# | StrokeWidth 0
; the week's box: its ring 127..234 by 30..151
Shape9=Rectangle 127,30,108,1 | Fill Color #Shadow# | StrokeWidth 0
Shape10=Rectangle 127,30,1,122 | Fill Color #Shadow# | StrokeWidth 0
Shape11=Rectangle 127,151,108,1 | Fill Color #Shadow# | StrokeWidth 0
Shape12=Rectangle 234,30,1,122 | Fill Color #Shadow# | StrokeWidth 0
Shape13=Rectangle 128,31,108,1 | Fill Color #Hilite# | StrokeWidth 0
Shape14=Rectangle 128,31,1,122 | Fill Color #Hilite# | StrokeWidth 0
Shape15=Rectangle 128,152,108,1 | Fill Color #Hilite# | StrokeWidth 0
Shape16=Rectangle 235,31,1,122 | Fill Color #Hilite# | StrokeWidth 0

[MeterLegSession]
; the legends on the boxes' top edges, 4 px in from each corner.  Their
; Face padding blanks the etched line behind the text
Meter=String
MeterStyle=StyleText
X=(#Pad# + 14)
Y=(#Pad# + 24 + #TextDY#)
SolidColor=#Face#
Padding=4,0,4,0
Text=Session

[MeterLegWeek]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 131)
Y=(#Pad# + 24 + #TextDY#)
SolidColor=#Face#
Padding=4,0,4,0
Text=Week

[MeterSessionDial]
; the session's gauge, drawn whole by claude.rs.  A picture, not a field:
; nothing in it can be typed in.  An Image meter because that is the kind
; the program draws itself; there is no picture file.
Meter=Image
X=(#Pad# + #SessionX#)
Y=(#Pad# + #DialY#)
W=#DialD#
H=#DialD#

[MeterWeekDial]
Meter=Image
X=(#Pad# + #WeekX#)
Y=(#Pad# + #DialY#)
W=#DialD#
H=#DialD#

; The percentage stands in the open foot of each face, under the hub,
; between the two ends of the scale, drawn over the gauge.  The line under
; each gauge is 4 px clear of the bezel, and its ink is 7 px clear of the
; ring below, as the Battery's Status row is.  All of them are centred on
; their gauge: the session's on x 64, the week's on x 181.

[MeterSessionPct]
; "43%", as the Battery writes its charge; "--" with nothing to show
Meter=String
MeterStyle=StyleText | StylePct
X=(#Pad# + #SessionX# + 44)
Y=(#Pad# + #DialY# + 55 + #TextDY#)
Text=#SessionPct#

[MeterWeekPct]
Meter=String
MeterStyle=StyleText | StylePct
X=(#Pad# + #WeekX# + 44)
Y=(#Pad# + #DialY# + 55 + #TextDY#)
Text=#WeekPct#

[MeterSessionReset]
; how long until it resets, "3h 57m till reset"; "Not started" once a
; session has run out and no other has begun; or, while there is trouble,
; what it is: "Offline", "Signed out"
Meter=String
MeterStyle=StyleText | StyleReset
X=(#Pad# + #SessionX# + 44)
Y=(#Pad# + 133 + #TextDY#)
Text=#SessionReset#

[MeterWeekReset]
; "1d 8h till reset", or from ten hours off to the hour, "14h till reset"
Meter=String
MeterStyle=StyleText | StyleReset
X=(#Pad# + #WeekX# + 44)
Y=(#Pad# + 133 + #TextDY#)
Text=#WeekReset#
