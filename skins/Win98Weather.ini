; ===========================================================================
;  Win98 Weather  --  widget skin
;  Today's weather as a Win98 property-dialog panel: current temperature and
;  condition icon, the city in a field you can type into, and today's
;  high/low.  The frame is 190 square: as wide as the Sticky Note, so the two
;  stack edge to edge.
;  Same warm golden / orange-brown scheme and chrome as the sibling widgets.
;  The condition icons are the PNGs in the Icons folder.
;
;  Structure:
;    Variables      palette, layout knobs, program-written state
;    Styles         shared text options
;    Chrome         frame, title bar, earth icon, title, buttons
;    Input          the one-line edit box that goes over the city field
;    Weather panel  one etched group box, legend on its edge -- the sibling's
;                   usage-panel treatment -- a centred column of icon, current
;                   temp, condition and high/low, then the city field
;
;  Data flow: weather.rs resolves this machine's public IP location (once a
;  day), copies lat/lon into #Lat#/#Lon#, and then asks Open-Meteo (no key
;  needed) every 30 minutes for five values -- temperature, is_day, weather
;  code, today's high and today's low.
;
;  The city.  A click on the city field puts a one-line edit box over it
;  (src/entry.rs).  Type a city -- "Lviv", or "Paris, US" / "Portland, Maine"
;  to say which one -- and press Enter, or click anywhere else: Open-Meteo's
;  geocoder turns the name into a place, and weather.rs keeps it in
;  settings.ini as ManualLat / ManualLon / ManualLocation, after which the IP
;  lookup is never made.  Escape leaves things as they were.  Emptying the
;  field goes back to the place the IP address gives.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette -----------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
UseInk=170,78,28

; --- icon palette ------------------------------------------------------------
; the title-bar earth is pixel art in the Win98 icon idiom, so it keeps that
; era's own colours rather than the warm chrome above -- the same flat VGA
; fills and hard black outline as the condition icons in the Icons folder
IcoOutline=0,0,0
IcoWhite=255,255,255
IcoRain=0,0,255
IcoRainDark=0,0,128
IcoIce=128,192,255
IcoLand=0,168,0

; --- location + units --------------------------------------------------------
; Lat/Lon start empty and are written once by weather.rs when the IP lookup
; resolves. To pin the skin to one place instead -- or to keep it off
; ip-api.com altogether -- type a city into the widget's city field, which
; fills in ManualLat / ManualLon (decimal degrees) and ManualLocation in
; settings.ini; they can be written there by hand as well. With the first two
; set the IP lookup is never made at all.
; TempUnit is Open-Meteo's own unit name, so it drops straight into the
; request URL: celsius or fahrenheit.
Lat=
Lon=
ManualLat=
ManualLon=
ManualLocation=
TempUnit=celsius

; --- written by weather.rs --------------------------------------------------
; defaults read sensibly before the first fetch completes
TempNow=--
Condition=Loading...
HighLowText=--
LocationLabel=

[EditBox]
; The one keyboard in the skin: the edit box, src/entry.rs, which a click on
; [MeterCityField] opens.  It covers the inside of that field and nothing
; else -- x 23..166 by y 147..162 of the frame, the #FieldBg# the two bevel
; rings enclose -- so none of the chrome is underneath it and nothing moves
; when it opens.
X=(#Pad# + 23)
Y=(#Pad# + 147)
W=144
H=16
; Three pixels down from the top of the field puts the typed line on y 150,
; where [MeterLocation] draws the city, so the name does not jump as the box
; opens over it.  Left and right stay 0: the text is centred, like the meter.
Padding=0,3,0,0

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(190 + 2 * #Pad#),(190 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,190,190 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,190,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,190 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,189,190,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 189,0,1,190 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,188,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,188 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,188,188,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 188,1,1,188 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,184,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0


[MeterIcon]
; the earth, as a 16x16 Win98 title-bar icon: black outline, pale ocean at the
; top-left falling to navy at the bottom-right, green land, one white
; specular. One rectangle per run of same-coloured pixels -- the same way the
; buttons' glyphs below are drawn. Grid coordinates, so the meter's X/Y place
; it inside the title bar.
Meter=Shape
X=(#Pad# + 4)
Y=(#Pad# + 4)
; the earth, 16x16, one rectangle per run of same-coloured pixels
