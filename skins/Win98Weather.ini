[MeterBox]
; the panel's group box: the sibling's etched double ring -- a Shadow
; ring with a Hilite ring one px down-right of it.
;
; It stands as far from the window's edge as the Date/Time skin's "Computer
; use" box stands from its panel's, because that is the spacing to match:
; 8 px of bare face between the frame's bevel and the ring at either side,
; 5 below, and 9 between the title bar and the top line.  Inside it the same
; again -- a field sits 9 clear px in from the ring.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 10,30,169,1 | Fill Color #Shadow# | StrokeWidth 0
Shape2=Rectangle 10,30,1,152 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 10,181,169,1 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 178,30,1,152 | Fill Color #Shadow# | StrokeWidth 0
Shape5=Rectangle 11,31,169,1 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 11,31,1,152 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 11,182,169,1 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 179,31,1,152 | Fill Color #Hilite# | StrokeWidth 0

[MeterLeg]
; the legend sits on the box's top edge, 4 px in from its corner; its Face
; padding blanks the etched line behind the text
Meter=String
MeterStyle=StyleText
X=(#Pad# + 14)
Y=(#Pad# + 24 + #TextDY#)
SolidColor=#Face#
Padding=4,0,4,0
Text=Today's Weather

[MeterIconWeather]
; the condition glyph: a 32x32 Win98-era icon from the Icons folder, picked
; by weather.rs and drawn by it; nothing is drawn until the first forecast
; arrives
Meter=Image
X=(#Pad# + 79)
Y=(#Pad# + 49)
W=32
H=32

[MeterTempNow]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 95)
Y=(#Pad# + 80 + #TextDY#)
StringAlign=Center
FontSize=20
StringStyle=Bold
Text=#TempNow#

[MeterCondition]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 95)
Y=(#Pad# + 111 + #TextDY#)
W=150
StringAlign=Center
ClipString=1
Text=#Condition#

[MeterHighLow]
; today's high and low: a reading, so plain text straight under the
; condition, with no field of its own.  The readings stay together; the one
; thing that can be typed into comes after them.
Meter=String
MeterStyle=StyleText
X=(#Pad# + 95)
Y=(#Pad# + 126 + #TextDY#)
W=150
H=14
StringAlign=Center
ClipString=1
Text=#HighLowText#

[MeterCityField]
; where the forecast is for, in a field that looks like what it is: a Win98
; text box, with the same two-ring sunken edge as the siblings' fields (2px
; per side).  A click anywhere in it opens [EditBox] over its inside.
;
; It is the only white field in the panel, and that is deliberate.  A white
; sunken field says "you can type here", so nothing that is only a reading
; gets one: the temperature, the condition and the high/low are plain text on
; the face.  The high/low used to sit in a field of its own, and beside this
; one it read as a second thing to fill in.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 21,145,148,20 | Fill Color #FieldBg# | StrokeWidth 0
Shape2=Rectangle 21,145,148,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 21,145,1,20 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 21,164,148,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 168,145,1,20 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 22,146,146,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 22,146,1,18 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 22,163,146,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 167,146,1,18 | Fill Color #Light# | StrokeWidth 0
LeftMouseUpAction=EditCity()

[MeterLocation]
; the city in the field -- or, for a few seconds, what became of the last
; name typed into it.  It takes no click of its own: the field under it does.
Meter=String
MeterStyle=StyleText
X=(#Pad# + 95)
Y=(#Pad# + 150 + #TextDY#)
W=140
H=14
StringAlign=Center
ClipString=1
Text=#LocationLabel#
