; ===========================================================================
;  Win98 Rain Window  --  widget skin
;  Rain the colour of rust, falling past a small dark window.  It shows
;  nothing and tells nothing: it is there to be looked at.  Sibling of the
;  Sticky Note and exactly its size -- a 190 x 220 frame -- so the two stand
;  side by side; same warm golden / orange-brown chrome as all of them.
;
;  Structure:
;    Variables      palette, the pane's rectangle, the rain's own colours
;    Styles         shared text and button options
;    Chrome         frame, title bar, icon, title, buttons
;    Pane           the sunken bezel, and the one meter rain.rs draws in
;
;  Everything that moves is drawn by rain.rs into [MeterRain]: the dusk
;  behind the rain, three depths of falling streaks, and the splash and ripple
;  each leaves where it lands.  The colours it uses are the Rain* variables
;  below, so the picture is still restyled from here.
;
;  The pane is dark on purpose.  A white sunken field says "you can type
;  here", and nobody can type in the rain.
;
;  Performance: this is the one widget that is redrawn more than once a
;  second.  Only the pane is repainted, a frame at a time, by a timer that
;  runs while there is rain to show and at no other time -- not while the
;  widget is paused or closed, and not while the workstation is locked.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208

; --- the pane --------------------------------------------------------------
; The inside of the sunken bezel, x 8..181 by y 29..211 of the frame: what
; rain.rs has to draw in.  [MeterPane] and [MeterRain] are both laid out from
; these four, and rain.rs takes the size of its picture from the last two.
PaneX=8
PaneY=29
PaneW=174
PaneH=183

; --- the rain's colours ----------------------------------------------------
; The dusk behind the rain runs from RainSky1 at the top of the pane down to
; RainSky2 at the horizon.  Below the horizon are GroundH rows of wet ground
; for the rain to land on: RainGround where it meets the sky, darkening to
; RainSky1 again at the foot of the pane.
RainSky1=24,15,10
RainSky2=78,40,20
RainGround=56,30,17
GroundH=16
; three depths of rain, the farthest dimmest; RainGlint is the bright head of
; the nearest drops, and the first flash of a splash
RainFar=112,58,28
RainMid=170,78,28
RainNear=218,118,52
RainGlint=247,200,140

; --- remembered between runs -----------------------------------------------
; rain.rs keeps these two in settings.ini, starting from the values here.
; Rate is how hard it rains: 1 light, 2 steady, 3 heavy.
Rate=2
Paused=0

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(190 + 2 * #Pad#),(220 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,190,220 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,190,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,220 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,219,190,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 189,0,1,220 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,188,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,218 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,218,188,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 188,1,1,218 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,184,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; one raindrop: an inked outline around a rust fill, with a pale glint down
; its left side.  Drawn on x 8..14, y 4..15 like the siblings' icons, and
; nudged the same +2 right and +2 down so its 12 rows sit centered in the
; bar's 18.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 11,4,1,2 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 10,6,3,2 | Fill Color #Ink# | StrokeWidth 0
Shape3=Rectangle 9,8,5,2 | Fill Color #Ink# | StrokeWidth 0
Shape4=Rectangle 8,10,7,4 | Fill Color #Ink# | StrokeWidth 0
Shape5=Rectangle 9,14,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape6=Rectangle 10,15,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape7=Rectangle 11,6,1,2 | Fill Color #Accent2# | StrokeWidth 0
Shape8=Rectangle 10,8,3,2 | Fill Color #Accent2# | StrokeWidth 0
Shape9=Rectangle 9,10,5,4 | Fill Color #Accent2# | StrokeWidth 0
Shape10=Rectangle 10,14,3,1 | Fill Color #Accent2# | StrokeWidth 0
Shape11=Rectangle 9,11,1,2 | Fill Color #IconFace# | StrokeWidth 0
Shape12=Rectangle 10,13,1,1 | Fill Color #IconFace# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 24)
Y=(#Pad# + 6 + #TextDY#)
FontColor=#TitleInk#
StringStyle=Bold
Text=Rain Window

[MeterBtnHelp]
; where the Weather widget, the other 190 px one with a ?, has its own
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 148)
Y=(#Pad# + 5)
Shape10=Rectangle 6,3,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 9,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 5,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 9,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 8,6,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 7,7,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 7,8,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 7,10,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=About()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 167)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Pane -----------------------------------------------------------------

[MeterPane]
; the same two-ring sunken edge as the siblings' fields (2px per side), set
; where the Sticky Note's paper is -- 4 px of bare face inside the frame's
; bevel to the left, the right and below, 5 under the title bar -- and run
; down to the foot of the window, where the note has its status bar.  It is
; filled with the dusk's darkest colour, so the pane reads as a dark window
; even before rain.rs has drawn a frame in it.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 6,27,178,187 | Fill Color #RainSky1# | StrokeWidth 0
Shape2=Rectangle 6,27,178,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,27,1,187 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,213,178,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 183,27,1,187 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 7,28,176,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 7,28,1,185 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 7,212,176,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 182,28,1,185 | Fill Color #Light# | StrokeWidth 0

[MeterRain]
; the picture: everything inside the bezel, drawn whole by rain.rs a frame at
; a time.  An Image meter because that is the kind the program draws itself;
; its W and H are what a repaint of the rain is limited to, so none of the
; chrome around it is touched while it rains.
Meter=Image
X=(#Pad# + #PaneX#)
Y=(#Pad# + #PaneY#)
W=#PaneW#
H=#PaneH#
