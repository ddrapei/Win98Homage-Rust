; ===========================================================================
;  Win98 Weather, as a window  --  widget skin
;  The Weather widget's second look, picked from its right-click menu: the
;  weather itself, out of a window onto a place, with the readings written
;  over it.  As tall as the Rain Window and wider, as a landscape is -- a
;  262 x 220 frame -- with the Weather panel's earth in the title bar, and
;  the place where the panel has "Weather".
;
;  Structure:
;    Variables      palette, the pane, the scenes' colours, the readings
;    Styles         shared text and button options
;    Chrome         frame, title bar, earth, the place, its field, buttons
;    Pane           the sunken bezel, and the one meter sky.rs draws in
;    Readings       what is written over the scene
;
;  Everything that moves is drawn by sky.rs into [MeterSky]: one of twelve
;  scenes, each over a place of its own -- a lake among mountains for a
;  clear sky, farmland under fair-weather cumulus, a town under a grey
;  layer, a valley in fog, an autumn avenue in drizzle, a street in the
;  rain, a lighthouse coast in heavy rain, a country road in sleet, a
;  forest cabin in snow, the Alps in a blizzard, a prairie in a
;  thunderstorm and a farm in hail -- by day, at dusk or by night, as the
;  sun stands where the forecast is for.
;
;  The scenes are in nature's colours, not the accent's: the colour picked
;  in the menu turns the window round them, as it turns every window, but
;  leaves the sky blue and the grass green -- as it leaves the weather
;  icons and the photo frames' photos.  Every colour they are painted in is
;  below, by name, so they are still restyled from here.
;
;  The place.  The title bar names where the forecast is for.  Set city...
;  in the right-click menu types another there, where the name stands, as
;  Folders' Rename title does: Enter takes it, Escape does not, and an empty
;  title goes back to the place the IP address gives.  There is no white
;  field: nothing else here is typed in.
;
;  Performance: the scene is redrawn 25 times a second while something falls,
;  12 while only clouds and stars move, and 6 in fog -- only the pane, and
;  only while this look is showing and not paused.  The place itself and
;  the clouds' shading are worked out once a minute, as the light changes,
;  and the readings once each time one changes; a frame puts them up.
; ===========================================================================

[Variables]
