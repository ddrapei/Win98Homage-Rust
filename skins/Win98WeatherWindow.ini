Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

[StyleReadShadow]
; a reading's shadow: a pixel down and to the right of the reading, drawn
; first.  Hidden, because the host never draws a reading: weather.rs draws
; them all, once, onto a clear picture the pane's size (see [MeterSky])
