; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are, and so does everything in the scenes:
; the earth, and every colour from the sky down (the names with a * stand
; for every colour that starts so)
Tint=#Accent2#
