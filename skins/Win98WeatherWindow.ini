; --- the place, typed in the title bar -----------------------------------------
; While the place is typed, the title bar has a field in it, as Folders' has
; for its title: Ink round a FieldBg box.  The text sits CityInset px in
; from its left and CityDrop px down, and what is selected of it is drawn
; light on dark in the title bar's own brown.
CityInset=2
CityDrop=1
SelectBg=#TitleA#
SelectInk=#TitleInk#

; --- the pane --------------------------------------------------------------
; The inside of the sunken bezel, 8 px in from the frame's sides and under
; the title bar: what sky.rs has to draw in.  [MeterPane] and [MeterSky]
; are both laid out from these four, and sky.rs takes the size of its
; picture from the last two.  The twelve places are composed for this size.
PaneX=8
PaneY=29
PaneW=246
PaneH=183

; --- the sky ---------------------------------------------------------------
; Each sky runs from its 1 at the top of the pane down to its 2 at the
; horizon, in bands, dithered where they meet, as pixel art draws a sky.  A
; clear one by night, at dusk -- the sun within a few degrees of the horizon
; -- and by day, and a grey one for each, for a sky under cloud; sky.rs
; mixes between them as the sun rises and sets, and between the clear and
; the grey as the weather closes in.  StormSky darkens a storm's further.
SkyDay1=58,118,200
SkyDay2=160,206,238
SkyDusk1=52,58,118
SkyDusk2=250,158,104
SkyNight1=8,12,30
SkyNight2=30,42,80
GreyDay1=118,128,142
GreyDay2=178,184,192
GreyDusk1=66,64,82
GreyDusk2=146,122,116
GreyNight1=14,16,24
