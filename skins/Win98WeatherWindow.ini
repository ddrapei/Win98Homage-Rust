; --- the readings over the scene ------------------------------------------------
; Each reading is written twice: its shadow a pixel down and to the right,
; then the reading.  Over a pale sky the readings are dark with a light
; shadow, and over a darker one light with a dark shadow; sky.rs says which
; the scene is, and weather.rs answers ReadInk and ReadShadow with one pair
; or the other.
ReadDarkInk=#Ink#
ReadDarkShadow=236,240,246
ReadLightInk=#TitleInk#
ReadLightShadow=12,14,22
; where they start, in the pane: this far in from its left edge
ReadX=6

