Shape9=Rectangle (#FrameW# - 8),28,1,185 | Fill Color #Light# | StrokeWidth 0

[MeterSky]
; the picture: everything inside the bezel, drawn whole by sky.rs a frame at
; a time, and the readings below put up over it.  An Image meter because
; that is the kind the program draws itself; its W and H are what a repaint
; of the weather is limited to, so none of the chrome around it is touched
; while it moves.
Meter=Image
X=(#Pad# + #PaneX#)
Y=(#Pad# + #PaneY#)
W=#PaneW#
H=#PaneH#

; ---- Readings ---------------------------------------------------------------
;
; Over the top left of the scene: the temperature, big, then the condition,
; then up to six lines of what matters today -- the high and low always,
; then the chance of rain or snow, what it feels like, the wind and the UV
; when each is worth saying, and the next sunrise or sunset -- one under
; another, with no gap where one is not said.
;
; Every meter named MeterRead... is one of these.  They are hidden: the host
; never draws them.  weather.rs draws them, in this order, onto a picture
; the pane's size each time one of them changes, and that picture is put up
; over every frame of the scene -- so they are laid out once, not 25 times
; a second.  Their places are in the window, as every meter's are.

[MeterReadTempShadow]
Meter=String
MeterStyle=StyleReadShadow
X=(#Pad# + #PaneX# + #ReadX# + 1)
Y=(#Pad# + #PaneY# + 2)
FontSize=20
StringStyle=Bold
Text=#TempNow#

[MeterReadConditionShadow]
Meter=String
MeterStyle=StyleReadShadow
X=(#Pad# + #PaneX# + #ReadX# + 1)
Y=(#Pad# + #PaneY# + 33)
StringStyle=Bold
Text=#Condition#

