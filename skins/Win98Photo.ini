; ===========================================================================
;  Win98 Photo Frame  --  widget skin
;  The photos in a folder, one after another, each brought down to what the
;  screen of a Siemens C60 showed: 101 x 80 pixels and 4096 colours.  Every
;  pixel of the photo is drawn as a Block x Block square of the skin's own,
;  so the picture is as chunky as the phone's was.
;
;  One file, three skins.  build.rs compiles it once for each shape, giving
;  PicW and PicH their own values each time:
;
;    photo_wide     202 x 160   (101 x 80 photo pixels: the C60 on its side)
;    photo_tall     160 x 202   ( 80 x 101: standing up)
;    photo_square   160 x 160   ( 80 x 80)
;
;  so everything below is laid out from those two, and the values given here
;  are only the wide one's.  photo.rs takes the number of photo pixels from
;  them as well (PicW / Block by PicH / Block).
;
;  Structure:
;    Variables      palette, the picture's size, the frame's size from it
;    Styles         shared text and button options
;    Chrome         frame, title bar, icon, title, buttons
;    Pane           the sunken bezel, the picture photo.rs draws, and what
;                   it says when there is no photo to show
;    Buttons        a shallow tray under the picture, and in it the slide
;                   show's row of three buttons -- previous, stop (play while
;                   stopped) and next -- which photo.rs draws, and presses in
;                   while one is held down
;
;  The pane is dark, as the Rain Window's is: a white sunken field says "you
;  can type here".  The photo itself is never tinted.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208
; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are, and so does the pane: a photo is
; shown in its own colours, against a dark that has none of the tint's
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink TitleInk IconFace Photo* Btn* Tray* Glyph*

; --- the picture -----------------------------------------------------------
; The inside of the sunken bezel, at x 8, y 29 of the frame -- where the
; Rain Window's pane is -- and PicW x PicH: one Block x Block square for each
; pixel of the photo.  build.rs gives PicW and PicH the size of each shape.
PicW=202
PicH=160
Block=2
; the frame round it: 8 px of bevel and face to the left and the right, the
; title bar and 5 px above, and below it the tray of buttons -- 4 px under
; the bezel, 22 px tall, then 4 px of face and the bevel (see [MeterTray])
FrameW=(#PicW# + 16)
FrameH=(#PicH# + 63)

; --- the pane's colours ----------------------------------------------------
; PhotoBg is the pane with no photo in it, and what a transparent part of a
; photo is laid on: one of the 4096 colours a photo is brought down to (each
; channel a multiple of 17), so that what is laid on it stays flat rather
; than dithered.  PhotoInk is what the pane says when it has none to show
PhotoBg=34,17,17
PhotoInk=197,184,161

; --- the buttons -----------------------------------------------------------
; Three buttons in a row, in the manner of a classic media player's: each
; BtnW x BtnH with a pixel of BtnLine round it, BtnGap px of the tray's floor
; between them, in a tray just big enough to hold the row with TrayPadX px
; of floor at either end and TrayPadY above and below, centred under the
; picture.  Each is a flat light face with a
; bright top row and left column, a right edge two shades darker and a foot
; three shades deep -- BtnEdge1 to BtnEdge3 -- and every symbol is cut into
; the face the same way: its top and left edges dark, its middle a shade
; under the face, a light edge under it and to its right.  All the symbols
; are 9 px tall.
;
; Held down, a button goes in BtnTravel steps, a step each frame: first its
; highlight goes, its foot thins and its face drops a pixel; then its top and
; left are in shade, its face is a shade darker and the symbol has moved a
; pixel down and right.  Let go, it comes back the same way.
BtnW=22
BtnH=16
BtnGap=3
BtnTravel=2
TrayPadX=3
TrayPadY=1
; the row, and the tray round it (its single ring counted in): 86 x 22
RowW=(3 * (#BtnW# + 2) + 2 * #BtnGap#)
TrayW=(#RowW# + 2 * #TrayPadX# + 2)
TrayH=(#BtnH# + 2 + 2 * #TrayPadY# + 2)
TrayX=((#FrameW# - #TrayW#) / 2)
BtnLine=#DkShadow#
BtnHi=240,233,218
BtnFace=206,194,171
BtnFaceDown=190,177,154
BtnEdge1=168,155,131
BtnEdge2=132,120,100
BtnEdge3=96,86,71
; the cut symbols: dark edge, middle, light edge -- and on the back button,
; with no photo to go back to, only a faint cut, as a greyed button's
GlyphDark=86,76,62
GlyphFill=168,155,131
GlyphLit=#BtnHi#
GlyphOff=#BtnEdge1#
; the tray's floor
TrayBg=152,139,117

; --- remembered between runs -----------------------------------------------
; photo.rs keeps these in each frame's own section of settings.ini, starting
; from the values here.  Folder is where the photos are (beside settings.ini
; unless it says where itself); Shape is wide, tall or square; Interval is
; the seconds each photo is shown for.
Folder=Photos
Shape=wide
Interval=10
Paused=0

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

[StylePaneText]
; what the pane says with no photo in it: light on the dark, centred across
; the picture
FontColor=#PhotoInk#
StringAlign=Center
X=(#Pad# + 8 + #PicW# / 2)
Hidden=#HasPhoto#

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(#FrameW# + 2 * #Pad#),(#FrameH# + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,#FrameW#,#FrameH# | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,#FrameW#,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,#FrameH# | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,(#FrameH# - 1),#FrameW#,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle (#FrameW# - 1),0,1,#FrameH# | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,(#FrameW# - 2),1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,(#FrameH# - 2) | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,(#FrameH# - 2),(#FrameW# - 2),1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle (#FrameW# - 2),1,1,(#FrameH# - 2) | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,(#FrameW# - 6),18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; a framed picture: an inked frame round a pale sky, two hills in the accent
; and a sun over the right one.  Drawn on x 6..17, y 5..14 like the Disk
; Space's drive, and nudged the same +2 right and +2 down as the siblings'
; icons.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 6,5,12,10 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 7,6,10,8 | Fill Color #IconFace# | StrokeWidth 0
Shape3=Rectangle 14,7,2,2 | Fill Color #Accent2# | StrokeWidth 0
Shape4=Rectangle 9,9,1,1 | Fill Color #Accent2# | StrokeWidth 0
Shape5=Rectangle 8,10,3,1 | Fill Color #Accent2# | StrokeWidth 0
Shape6=Rectangle 13,10,1,1 | Fill Color #Accent2# | StrokeWidth 0
Shape7=Rectangle 7,11,10,3 | Fill Color #Accent2# | StrokeWidth 0
Shape8=Rectangle 11,11,1,1 | Fill Color #IconFace# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 24)
Y=(#Pad# + 6 + #TextDY#)
FontColor=#TitleInk#
StringStyle=Bold
Text=Photo Frame

[MeterBtnHelp]
; 42 px in from the right, where every other widget with a ? has its own
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + #FrameW# - 42)
Y=(#Pad# + 5)
Shape10=Rectangle 6,3,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 9,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 5,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 9,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 8,6,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 7,7,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 7,8,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 7,10,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=About()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + #FrameW# - 23)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Pane -----------------------------------------------------------------

[MeterPane]
; the same two-ring sunken edge as the siblings' fields (2px per side), 4 px
; of bare face inside the frame's bevel to the left, the right and below, and
; 5 under the title bar, as the Rain Window's pane has.  Filled with PhotoBg,
; so it reads as a dark window while there is no photo in it.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 6,27,(#PicW# + 4),(#PicH# + 4) | Fill Color #PhotoBg# | StrokeWidth 0
Shape2=Rectangle 6,27,(#PicW# + 4),1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 6,27,1,(#PicH# + 4) | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 6,(#PicH# + 30),(#PicW# + 4),1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle (#PicW# + 9),27,1,(#PicH# + 4) | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 7,28,(#PicW# + 2),1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 7,28,1,(#PicH# + 2) | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 7,(#PicH# + 29),(#PicW# + 2),1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle (#PicW# + 8),28,1,(#PicH# + 2) | Fill Color #Light# | StrokeWidth 0

[MeterPhoto]
; the photo, drawn whole by photo.rs: a Block x Block square for each of its
; pixels.  An Image meter because that is the kind the program draws itself;
; its W and H are what a repaint for the next photo is limited to.  A click
; on it shows the next one.
Meter=Image
X=(#Pad# + 8)
Y=(#Pad# + 29)
W=#PicW#
H=#PicH#
LeftMouseUpAction=Next()

[MeterEmpty]
; with no photo to show: two lines in the middle of the pane, 13 rows apart
Meter=String
MeterStyle=StyleText | StylePaneText
Y=(#Pad# + 29 + #PicH# / 2 - 15)
Text=No photos here

[MeterEmptyHint]
Meter=String
MeterStyle=StyleText | StylePaneText
Y=(#Pad# + 29 + #PicH# / 2 - 2)
Text=Right-click to choose a folder

; ---- Buttons --------------------------------------------------------------

[MeterTray]
; the section the buttons stand in: a tray sunken a single ring, the way a
; Win98 status bar is (and the Sticky Note's panels), just big enough for
; the row -- TrayW x TrayH -- centred under the picture, 4 px under its
; bezel (y PicH + 35 to PicH + 56) and 4 px above the frame's bevel.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle #TrayX#,(#PicH# + 35),#TrayW#,#TrayH# | Fill Color #TrayBg# | StrokeWidth 0
Shape2=Rectangle #TrayX#,(#PicH# + 35),#TrayW#,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle #TrayX#,(#PicH# + 35),1,#TrayH# | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle #TrayX#,(#PicH# + 34 + #TrayH#),#TrayW#,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle (#TrayX# + #TrayW# - 1),(#PicH# + 35),1,#TrayH# | Fill Color #Hilite# | StrokeWidth 0

[MeterButtons]
; the tray's floor, inside its ring, where photo.rs draws the buttons as they
; stand -- up, in, or on their way -- and finds which one a press lands on.
; An Image meter because that is the kind the program draws itself; its W
; and H are what a repaint of a moving button is limited to.
Meter=Image
X=(#Pad# + #TrayX# + 1)
Y=(#Pad# + #PicH# + 36)
W=(#TrayW# - 2)
H=(#TrayH# - 2)
