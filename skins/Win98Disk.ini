; ===========================================================================
;  Win98 Disk Space  --  widget skin
;  How full a drive is, as the General page of a Win98 drive's Properties
;  has it: the space used and the space free, each with the swatch of its
;  colour, the capacity, and the two as a pie seen from a little above.  The
;  frame is 190 square, the size of the Weather widget, so the two stack
;  edge to edge.  Same warm golden / orange-brown scheme and chrome as the
;  sibling widgets.
;
;  Structure:
;    Variables      palette, the pie's rectangle and colours, program-written
;                   state
;    Styles         shared text, title-bar button and spin-button options
;    Chrome         frame, title bar, drive icon, title, buttons
;    Drive panel    one etched group box with the kind of drive on its edge,
;                   the drive in a field with a spin button beside it, the
;                   pie, and three rows of figures
;
;  Which drive.  The field holds one drive -- its label and its letter -- and
;  the spin buttons beside it step to the one before and the one after, as
;  the year's do on the Date/Time skin; so does the wheel over the field.
;  The right-click menu has every drive by its letter.  disk.rs keeps the
;  choice in settings.ini as Drive.
;
;  The pie is drawn by disk.rs into [MeterPie], a pixel at a time and with no
;  smoothing, like the one it is after: a flat ellipse with a rim below it,
;  the free space a slice that starts at three o'clock and runs clockwise,
;  every edge one px of ink.  Its colours are the Pie* variables below, and
;  the two swatches in the rows use the same two, so the picture and its key
;  cannot disagree.
;
;  Performance: a drive on this machine is asked for its figures once every
;  five seconds, which is one system call; nothing is repainted unless a
;  figure that is shown has changed.  A network drive, a disc or a card may
;  take its time to answer, so those are asked from a thread of their own and
;  only every half minute -- the widgets never wait for one.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208

; --- the pie ---------------------------------------------------------------
; [MeterPie]'s rectangle in the frame: disk.rs takes the size of its picture
; from the last three.  The ellipse on top is PieW wide and PieH - PieDepth
; tall, and the rim under it is PieDepth rows deep.
PieX=43
PieY=70
PieW=104
PieH=54
PieDepth=10
; Used space is the rust of the sibling's usage bars, free space the pale of
; a field; each has a darker shade for its part of the rim.  PieNone is a
; drive with nothing to show: no disc in it, or not there at all.
PieUsed=170,78,28
PieUsedSide=112,48,16
PieFree=247,243,233
PieFreeSide=197,184,161
PieNone=197,184,161
PieNoneSide=116,105,88

; --- remembered between runs -----------------------------------------------
; disk.rs keeps this in settings.ini, starting from the value here: the
; letter of the drive to show.  Empty is the drive Windows is on.
Drive=

; --- written by disk.rs ----------------------------------------------------
; defaults read sensibly before the first reading arrives
DriveKind=Disk
DriveName=
UsedSize=--
UsedPct=
FreeSize=--
FreePct=
Capacity=--

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

[StyleSpin]
; one half of a spin button: the 15x9 outset the Date/Time skin's year field
; has two of, arrow left to the meter.  From the meter's own origin, like the
; title bar's buttons, so a click has to land on the button itself
Shape=Rectangle 0,0,15,9 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,15,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,9 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,8,15,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 14,0,1,9 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,13,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,7 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,7,13,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 13,1,1,7 | Fill Color #Shadow# | StrokeWidth 0

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(190 + 2 * #Pad#),(190 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,190,190 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,190,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,190 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,189,190,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 189,0,1,190 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,188,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,188 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,188,188,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 188,1,1,188 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,184,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; a disk drive seen from the front and a little above: an inked box, its top
; and its front a pale face with the seam between them, a slot in the front
; and the accent of its light.  Drawn on x 6..17, y 5..14 and nudged the
; same +2 right and +2 down as the siblings' icons.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 6,5,12,10 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 7,6,10,3 | Fill Color #IconFace# | StrokeWidth 0
Shape3=Rectangle 7,10,10,4 | Fill Color #IconFace# | StrokeWidth 0
Shape4=Rectangle 8,12,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape5=Rectangle 14,11,2,2 | Fill Color #Accent2# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 24)
Y=(#Pad# + 6 + #TextDY#)
FontColor=#TitleInk#
StringStyle=Bold
Text=Disk Space

[MeterBtnHelp]
; where the other 190 px widgets with a ? have theirs
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 148)
Y=(#Pad# + 5)
Shape10=Rectangle 6,3,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 9,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 5,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 9,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 8,6,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 7,7,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 7,8,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 7,10,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=About()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 167)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Drive panel ----------------------------------------------------------

[MeterBox]
; the panel's group box, the Weather widget's to the pixel: an etched double
; ring -- a Shadow ring with a Hilite ring one px down-right of it -- 8 px of
; bare face from the frame's bevel at either side, 5 below, and 9 between the
; title bar and the top line.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 10,30,169,1 | Fill Color #Shadow# | StrokeWidth 0
Shape2=Rectangle 10,30,1,152 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 10,181,169,1 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 178,30,1,152 | Fill Color #Shadow# | StrokeWidth 0
Shape5=Rectangle 11,31,169,1 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 11,31,1,152 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 11,182,169,1 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 179,31,1,152 | Fill Color #Hilite# | StrokeWidth 0

[MeterLeg]
; the legend on the box's top edge says what kind of drive this is -- Local
; Disk, Removable Disk, Network Drive -- which is the "Type:" line of the
; Properties page.  Its Face padding blanks the etched line behind the text
Meter=String
MeterStyle=StyleText
X=(#Pad# + 14)
Y=(#Pad# + 24 + #TextDY#)
SolidColor=#Face#
Padding=4,0,4,0
Text=#DriveKind#

[MeterDriveField]
; the drive, in a field with the same two-ring sunken edge as the siblings'
; fields (2px per side).  A white field with a spin button beside it is one
; whose value is stepped through, like the year on the Date/Time skin; it is
; not typed in.  The wheel over it, or over the buttons, steps as well.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 21,42,132,21 | Fill Color #FieldBg# | StrokeWidth 0
Shape2=Rectangle 21,42,132,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 21,42,1,21 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 21,62,132,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 152,42,1,21 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 22,43,130,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 22,43,1,19 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 22,61,130,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 151,43,1,19 | Fill Color #Light# | StrokeWidth 0
; the field and the buttons beside it, as far as the wheel is concerned
Shape10=Rectangle 153,42,16,21 | Fill Color 255,255,255,1 | StrokeWidth 0
MouseScrollUpAction=Step(-1)
MouseScrollDownAction=Step(1)

[MeterDrive]
; "Windows (C:)": the drive's label and its letter, or the letter alone for
; one that has no label.  disk.rs cuts a long label short so that the letter
; still fits; ClipString is for the label of wide letters that gets past that
Meter=String
MeterStyle=StyleText
X=(#Pad# + 27)
Y=(#Pad# + 46 + #TextDY#)
W=122
H=13
ClipString=1
Text=#DriveName#

[MeterSpinUp]
; the drive before this one
Meter=Shape
MeterStyle=StyleSpin
X=(#Pad# + 154)
Y=(#Pad# + 43)
Shape10=Rectangle 7,3,1,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 6,4,3,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Step(-1)

[MeterSpinDown]
; the drive after it
Meter=Shape
MeterStyle=StyleSpin
X=(#Pad# + 154)
Y=(#Pad# + 53)
Shape10=Rectangle 6,3,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 7,4,1,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Step(1)

[MeterPie]
; the picture, drawn whole by disk.rs.  An Image meter because that is the
; kind the program draws itself; there is no picture file.
Meter=Image
X=(#Pad# + #PieX#)
Y=(#Pad# + #PieY#)
W=#PieW#
H=#PieH#

[MeterSwatches]
; the key to the pie: an inked square of each slice's colour, at the head of
; that slice's row
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 21,133,10,10 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 22,134,8,8 | Fill Color #PieUsed# | StrokeWidth 0
Shape3=Rectangle 21,147,10,10 | Fill Color #Ink# | StrokeWidth 0
Shape4=Rectangle 22,148,8,8 | Fill Color #PieFree# | StrokeWidth 0

; Three rows of figures, 14 px apart: what it is, how much, and -- for the
; two that are slices of the pie -- what share of the drive that is.  The
; amounts end at x 139 and the shares at x 169, the field's right-hand edge.
; They are readings, so they are plain text on the face with no field.

[MeterUsedLabel]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 36)
Y=(#Pad# + 131 + #TextDY#)
Text=Used space:

[MeterUsedSize]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 139)
Y=(#Pad# + 131 + #TextDY#)
StringAlign=Right
Text=#UsedSize#

[MeterUsedPct]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 169)
Y=(#Pad# + 131 + #TextDY#)
StringAlign=Right
Text=#UsedPct#

[MeterFreeLabel]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 36)
Y=(#Pad# + 145 + #TextDY#)
Text=Free space:

[MeterFreeSize]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 139)
Y=(#Pad# + 145 + #TextDY#)
StringAlign=Right
Text=#FreeSize#

[MeterFreePct]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 169)
Y=(#Pad# + 145 + #TextDY#)
StringAlign=Right
Text=#FreePct#

[MeterCapLabel]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 36)
Y=(#Pad# + 159 + #TextDY#)
Text=Capacity:

[MeterCapSize]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 139)
Y=(#Pad# + 159 + #TextDY#)
StringAlign=Right
Text=#Capacity#
