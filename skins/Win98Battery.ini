; ===========================================================================
;  Win98 Battery  --  widget skin
;  How much charge the battery has, as a battery cell standing on end, seen
;  from a little above, its side five sections that light up from the
;  bottom: red at the foot, through orange and yellow, to green at the top,
;  so the less is left the redder it is.  Under it, the figure, and a Status
;  row: a plug when it is plugged in, with a bolt beside it while it charges,
;  or on battery the time left.  The smallest of the widgets:
;  a frame 120 px wide and 190 tall, the height of Weather and Disk Space, so
;  it stands in a row with them.  Same warm golden / orange-brown scheme and
;  chrome as the sibling widgets.
;
;  Structure:
;    Variables      palette, the battery's shape, the rings' figures and
;                   colours, program-written state
;    Styles         shared text and title-bar button options
;    Chrome         frame, title bar, battery icon, title, buttons
;    Power panel    one etched group box, legend on its edge, the battery,
;                   the bolt shown while it charges, the figure, and the
;                   Status row
;
;  The battery is drawn the way pixel art draws a cylinder, lit from the
;  left and a little in front.  Its top is an ellipse of flat metal, the
;  light catching its front edge, with the terminal standing up from the
;  middle of it: a little cylinder of its own, its top the brightest thing
;  on the battery with a glint at the left, its side shaded as the battery's
;  is, and its shadow falling on the top to its right.  Down the side there
;  is a band of metal at the top and another at the foot, each with a lip:
;  the top one darkens along its lower edge, the foot's catches the light
;  along its upper edge and darkens along its lower.  The side is
;  shaded in stripes down its length: its colour, a lighter stretch, the
;  shine of a reflection, its colour, a shade, a dark edge, and at the
;  right-hand edge a little light thrown back.  Every edge across it follows
;  the ellipse's front, so the bands and the sections curve round it.
;  Nothing is outlined: where the battery ends, its colours end.
;
;  The sections stand apart, like discs stacked on a spindle: in the space
;  between each two, and between them and the bands, is the battery's core,
;  narrower than the rest, so the battery's edge steps in there and the face
;  shows through -- space, not a line drawn across it.  The core is the
;  chrome's metal in the shade of the section above, striped as the side
;  is.  Each section's top row catches the light, as the top of a disc does.
;  Nothing is drawn outside the battery.  The sections not lit are there
;  too, dark grey, like the segments of a bar of
;  lights that are off, with the faint shine of the reflection on them.
;  battery.rs draws all of it into [MeterBattery] from the figures and
;  colours below; the metal is the chrome's own greys.
;
;  The rings' colours mean the same thing whatever colour is picked for the
;  widgets, so they are left out of the tint (Untinted=, below), like the
;  weather's icons and the disk pie's free space.
;
;  Performance: Windows is asked how the power stands once a second, which is
;  one system call; nothing is repainted unless something shown has changed.
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
; empty margin around the whole window, so it never sits flush against
; a screen edge or another skin
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette ---------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
Accent2=170,78,28
IconFace=236,226,208
; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are, and so do the battery's colours below
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink TitleInk IconFace Batt* CellOff BoltFill

; --- the battery -----------------------------------------------------------
; The battery: a picture BattW x BattH with its corner at BattX, BattY of
; the frame -- x 42..77 by y 42..143.  Its top is an ellipse as wide as it,
; BattRY px from its middle to its front edge, and every edge across its
; side curves as much.
BattX=42
BattY=42
BattW=36
BattH=102
BattRY=8
; The terminal standing on the top: TermW wide, its own top an ellipse
; TermRY px from its middle to its front edge, and its side TermH tall --
; tall enough for it to stand up past the top's back edge.
TermW=12
TermRY=3
TermH=6
; Down the side, from the top: a band of metal, Cells sections each CellH
; tall with CellGap of space before each and after the last, and a band of
; metal BandFoot tall at the foot.  The band at the top takes what the
; sections, the spaces and the foot leave of the side.
Cells=5
CellH=11
CellGap=3
BandFoot=6
; The core showing in the spaces: CoreInset px in from the battery's edge
; at either side, and its metal this many percent of the way to black, in
; the shade of the section above it.  Never black itself.
CoreInset=3
CoreShade=25
; how much a section's top row, catching the light, is lighter than the rest
CellBevel=30
; The rings' colours, from the foot of the battery to the top: BattLow for
; the bottom ring, BattMid half way up, BattHigh for the top one, and each
; ring between them a step of the way from one to the next.
BattLow=226,40,36
BattMid=250,204,44
BattHigh=56,180,72
; How a lit ring is shaded across, from its own colour: this many percent of
; the way to white for the reflection's shine and the lighter stretch, and
; to black for the shade, the dark edge and the light thrown back at the
; right-hand edge.
CellShine=55
CellLight=25
CellShade=22
CellEdge=42
CellRim=14
; a ring that is not lit, and how much lighter its shine and its lighter
; stretch are
CellOff=60,54,47
OffShine=16
OffLight=7
; the bolt shown while it charges, with an ink outline
BoltFill=255,248,224

; --- written by battery.rs -------------------------------------------------
; The defaults are a battery with nothing to show until the first reading.
BattPct=--
BattTime=
Charging=0
OnBattery=0

[StyleText]
; every string meter inherits this
FontSize=#FontSize#
FontColor=#Ink#
ClipString=0

[StyleButton]
; the 16x14 outset of a title bar button, glyph left to the meter.  Drawn
; from the meter's own origin so the rectangle a click has to land in is
; the button and nothing else
Shape=Rectangle 0,0,16,14 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,16,1 | Fill Color #Hilite# | StrokeWidth 0
Shape3=Rectangle 0,0,1,14 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 0,13,16,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 15,0,1,14 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,14,1 | Fill Color #Light# | StrokeWidth 0
Shape7=Rectangle 1,1,1,12 | Fill Color #Light# | StrokeWidth 0
Shape8=Rectangle 1,12,14,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 14,1,1,12 | Fill Color #Shadow# | StrokeWidth 0

; ---- Chrome ---------------------------------------------------------------

[MeterCanvas]
; sets the skin size to content + Pad on every side; alpha 1 keeps the
; margin drag-able without being visible
Meter=Shape
Shape=Rectangle 0,0,(120 + 2 * #Pad#),(190 + 2 * #Pad#) | Fill Color 0,0,0,1 | StrokeWidth 0

[MeterFrame]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 0,0,120,190 | Fill Color #Face# | StrokeWidth 0
Shape2=Rectangle 0,0,120,1 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 0,0,1,190 | Fill Color #Light# | StrokeWidth 0
Shape4=Rectangle 0,189,120,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape5=Rectangle 119,0,1,190 | Fill Color #DkShadow# | StrokeWidth 0
Shape6=Rectangle 1,1,118,1 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 1,1,1,188 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 1,188,118,1 | Fill Color #Shadow# | StrokeWidth 0
Shape9=Rectangle 118,1,1,188 | Fill Color #Shadow# | StrokeWidth 0

[MeterTitleBar]
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 3,3,114,18 | StrokeWidth 0 | Fill LinearGradient TitleGrad
TitleGrad=180 | #TitleA# ; 0.0 | #TitleB# ; 1.0

[MeterIcon]
; a battery standing up: an inked case with its terminal on top, a pale
; inside and the accent of its charge in the lower half.  Drawn on x 8..15,
; y 4..15 and nudged the same +2 right and +2 down as the siblings' icons.
Meter=Shape
X=(#Pad# + 2)
Y=(#Pad# + 2)
Shape=Rectangle 10,4,4,2 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 8,6,8,10 | Fill Color #Ink# | StrokeWidth 0
Shape3=Rectangle 9,7,6,8 | Fill Color #IconFace# | StrokeWidth 0
Shape4=Rectangle 10,10,4,4 | Fill Color #Accent2# | StrokeWidth 0

[MeterTitle]
Meter=String
MeterStyle=StyleText
X=(#Pad# + 24)
Y=(#Pad# + 6 + #TextDY#)
FontColor=#TitleInk#
StringStyle=Bold
Text=Battery

[MeterBtnHelp]
; as far in from the right as the 190 px widgets have theirs
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 78)
Y=(#Pad# + 5)
Shape10=Rectangle 6,3,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 9,4,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 5,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 9,5,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 8,6,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 7,7,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 7,8,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 7,10,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=About()

[MeterBtnClose]
Meter=Shape
MeterStyle=StyleButton
X=(#Pad# + 97)
Y=(#Pad# + 5)
Shape10=Rectangle 4,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 10,3,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape12=Rectangle 4,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 9,4,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape14=Rectangle 5,5,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 6,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape16=Rectangle 5,7,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape18=Rectangle 9,8,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 4,9,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape20=Rectangle 10,9,2,1 | Fill Color #Ink# | StrokeWidth 0
LeftMouseUpAction=Close()

; ---- Power panel ----------------------------------------------------------

[MeterBox]
; the panel's group box, the Weather widget's in a narrower frame: an etched
; double ring -- a Shadow ring with a Hilite ring one px down-right of it --
; 8 px of bare face from the frame's bevel at either side, 5 below, and 9
; between the title bar and the top line.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 10,30,99,1 | Fill Color #Shadow# | StrokeWidth 0
Shape2=Rectangle 10,30,1,152 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 10,181,99,1 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 108,30,1,152 | Fill Color #Shadow# | StrokeWidth 0
Shape5=Rectangle 11,31,99,1 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 11,31,1,152 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 11,182,99,1 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 109,31,1,152 | Fill Color #Hilite# | StrokeWidth 0

[MeterLeg]
; the legend on the box's top edge, 4 px in from its corner, named as the
; group box on Win98's Power Meter page was.  Its Face padding blanks the
; etched line behind the text
Meter=String
MeterStyle=StyleText
X=(#Pad# + 14)
Y=(#Pad# + 24 + #TextDY#)
SolidColor=#Face#
Padding=4,0,4,0
Text=Power status

; The battery stands as far below the legend's ink as above the figure's: 7
; px clear each way.  The figure and the Status row are 14 px apart, the
; row's ink 7 px clear of the ring below it.  The battery and the figure
; are centred on x 60; the Status row runs across the box, 9 px in
; from the ring at either side, its label to the left and its value to the
; right.  The row always has something in it, so that it stays that way.

[MeterBattery]
; the battery, drawn whole by battery.rs.  A picture, not a field: nothing
; in it can be typed in.  An Image meter because that is the kind the
; program draws itself; there is no picture file.
Meter=Image
X=(#Pad# + #BattX#)
Y=(#Pad# + #BattY#)
W=#BattW#
H=#BattH#

[MeterBolt]
; while it charges, a lightning bolt on the front of the battery, half way
; down its side: pale with an ink outline, so that it reads on the lit rings
; and the dark ones alike.  Each row is an ink run with the fill laid on
; it, as the title-bar icons are drawn.
Meter=Shape
X=(#Pad# + 53)
Y=(#Pad# + 91)
Hidden=(1 - #Charging#)
Shape=Rectangle 7,0,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 6,1,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape3=Rectangle 7,1,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape4=Rectangle 5,2,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape5=Rectangle 6,2,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape6=Rectangle 5,3,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape7=Rectangle 6,3,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape8=Rectangle 4,4,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape9=Rectangle 5,4,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape10=Rectangle 4,5,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 5,5,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape12=Rectangle 3,6,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 4,6,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape14=Rectangle 3,7,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 4,7,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape16=Rectangle 3,8,9,1 | Fill Color #Ink# | StrokeWidth 0
Shape17=Rectangle 4,8,4,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape18=Rectangle 2,9,11,1 | Fill Color #Ink# | StrokeWidth 0
Shape19=Rectangle 3,9,9,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape20=Rectangle 2,10,10,1 | Fill Color #Ink# | StrokeWidth 0
Shape21=Rectangle 3,10,8,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape22=Rectangle 1,11,10,1 | Fill Color #Ink# | StrokeWidth 0
Shape23=Rectangle 2,11,8,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape24=Rectangle 2,12,9,1 | Fill Color #Ink# | StrokeWidth 0
Shape25=Rectangle 6,12,4,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape26=Rectangle 5,13,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape27=Rectangle 6,13,3,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape28=Rectangle 5,14,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape29=Rectangle 6,14,3,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape30=Rectangle 4,15,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape31=Rectangle 5,15,3,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape32=Rectangle 4,16,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape33=Rectangle 5,16,2,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape34=Rectangle 4,17,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape35=Rectangle 5,17,2,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape36=Rectangle 3,18,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape37=Rectangle 4,18,2,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape38=Rectangle 3,19,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape39=Rectangle 4,19,1,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape40=Rectangle 3,20,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape41=Rectangle 4,20,1,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape42=Rectangle 3,21,2,1 | Fill Color #Ink# | StrokeWidth 0

; Two lines of readings, 14 px apart: how much is left, and the Status row.
; They are readings, so they are plain text on the face with no field.

[MeterPct]
; "76%", or "--" with no battery or no figure from it
Meter=String
MeterStyle=StyleText
X=(#Pad# + 60)
Y=(#Pad# + 149 + #TextDY#)
StringAlign=Center
StringStyle=Bold
Text=#BattPct#

[MeterStatusLabel]
; its ink from x 21, 9 px clear of the ring
Meter=String
MeterStyle=StyleText
X=(#Pad# + 20)
Y=(#Pad# + 163 + #TextDY#)
Text=Status:

[MeterStatusTime]
; on battery, the time left, "2h 15m", or "..." until Windows has worked it
; out; nothing while it is plugged in, when the plug is shown instead.  Its
; ink ends at x 98, 9 px clear of the ring
Meter=String
MeterStyle=StyleText
X=(#Pad# + 99)
Y=(#Pad# + 163 + #TextDY#)
StringAlign=Right
Text=#BattTime#

[MeterPlug]
; plugged in -- charging, charged, or held short of full, and a machine with
; no battery, which runs on the mains: a plug, its prongs to the right and
; its cord to the left, on the nine rows the row's capitals take, ending at
; x 98.  Inked round like the title-bar icons, its body the chrome's metal,
; light on the left and dark on the right as the battery is.
Meter=Shape
X=(#Pad# + 85)
Y=(#Pad# + 165)
Hidden=#OnBattery#
Shape=Rectangle 4,0,7,9 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 5,1,5,7 | Fill Color #Light# | StrokeWidth 0
Shape3=Rectangle 5,1,1,7 | Fill Color #Hilite# | StrokeWidth 0
Shape4=Rectangle 9,1,1,7 | Fill Color #Shadow# | StrokeWidth 0
Shape5=Rectangle 11,2,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape6=Rectangle 11,6,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape7=Rectangle 0,4,4,1 | Fill Color #Ink# | StrokeWidth 0

[MeterCharge]
; while it charges, a little bolt to the left of the plug, the big one's
; colours on the same nine rows
Meter=Shape
X=(#Pad# + 76)
Y=(#Pad# + 165)
Hidden=(1 - #Charging#)
Shape=Rectangle 3,0,2,1 | Fill Color #Ink# | StrokeWidth 0
Shape2=Rectangle 2,1,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape3=Rectangle 3,1,2,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape4=Rectangle 1,2,5,1 | Fill Color #Ink# | StrokeWidth 0
Shape5=Rectangle 2,2,2,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape6=Rectangle 0,3,7,1 | Fill Color #Ink# | StrokeWidth 0
Shape7=Rectangle 1,3,5,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape8=Rectangle 1,4,6,1 | Fill Color #Ink# | StrokeWidth 0
Shape9=Rectangle 3,4,3,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape10=Rectangle 2,5,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape11=Rectangle 3,5,2,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape12=Rectangle 1,6,4,1 | Fill Color #Ink# | StrokeWidth 0
Shape13=Rectangle 2,6,2,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape14=Rectangle 1,7,3,1 | Fill Color #Ink# | StrokeWidth 0
Shape15=Rectangle 2,7,1,1 | Fill Color #BoltFill# | StrokeWidth 0
Shape16=Rectangle 2,8,1,1 | Fill Color #Ink# | StrokeWidth 0
