Shape6=Rectangle 11,31,1,181 | Fill Color #Hilite# | StrokeWidth 0
Shape7=Rectangle 11,211,186,1 | Fill Color #Hilite# | StrokeWidth 0
Shape8=Rectangle 196,31,1,181 | Fill Color #Hilite# | StrokeWidth 0
; The count box: its ring 221..300; the count inked from 231, eight clear
; rows under the top line, as the first line of text in "Computer use" is;
; the date seven clear rows under the count, as the weather's condition is
; under its temperature; the name field 5 px under the date's line.
