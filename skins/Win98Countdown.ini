; ===========================================================================
;  Win98 Countdown  --  widget skin
;  How many days are left until a day picked on a calendar, and what the day
;  is for.  The top box is the Date/Time widget's calendar, the same field by
;  the same measure -- a month list and a year field with arrows over a grid
;  of six weeks -- with today in the dark block and the day counted to
;  ringed in red, as by hand.  The box under it has the count, big, the
;  date it counts to, and a field to type what the day is.  The frame is 207
;  wide and 308 tall: the calendar field's 165 and a group box's margins.
;  Same warm golden / orange-brown scheme and chrome as the sibling widgets.
;
;  There can be any number of these, as there can be of notes: the first is
;  [Countdown] in settings.ini, the others [Countdown2], [Countdown3], ...
;  each with its own Date= and Name=.
;
;  Structure:
;    Variables      palette, the icon's colours, program-written state
;    Styles         shared text options
;    Chrome         frame, title bar, hourglass icon, title, buttons
;    Calendar box   month and year fields, the calendar, the ring round the
;                   day counted to, today's block
;    Count box      the count, the date, the name field
;    Hit areas      invisible click targets over the calendar
;    Month list     the drop-down, drawn above everything
;
;  The calendar's meters are the Date/Time skin's, moved 5 px left and 38 up
;  (its calendar field is at 26,111 there and at 21,73 here); calendar.rs
;  answers both skins' D0..D41, W0..W6, MonthName, YearText, MLHide and
;  MLMonth.  Change one and look at the other.
;
;  The count and the date are readings, so plain text on the face; the name
;  is typed, so it is the white field (see CLAUDE.md).
; ===========================================================================

[Variables]
; --- layout ----------------------------------------------------------------
Pad=12

; --- typography ------------------------------------------------------------
Font=Microsoft Sans Serif
FontSize=8
TextDY=0

; --- palette -----------------------------------------------------------------
; shared with the sibling widgets: change them together
Face=172,158,134
Hilite=222,213,195
Light=197,184,161
Shadow=116,105,88
DkShadow=56,48,38
FieldBg=247,243,233
Ink=28,22,14
TitleA=74,26,8
TitleB=166,74,24
TitleInk=247,238,224
CalHead=78,32,12
CalHeadInk=233,217,194
Sel=74,26,8
SelInk=247,238,224
Accent2=170,78,28
; the ring round the day counted to, drawn by countdown.rs: red pen, as a
; day is ringed on a paper calendar, whatever colour the widgets are
Ring=214,36,36
; the colour the accents are drawn around: a tint chosen in the menu turns
; them by the difference from it, never in light and dark.  The chrome's
; greys and whites stay as they are, and so do the ring and the icon palette
; below
Tint=#Accent2#
Untinted=Face Hilite Light Shadow DkShadow FieldBg Ink TitleInk CalHeadInk SelInk Ring Ico*

; --- icon palette ------------------------------------------------------------
; the title-bar hourglass is pixel art in the Win98 icon idiom: flat VGA
; fills and a hard black outline, as the weather's earth has, and it keeps
; them whatever the tint
IcoOutline=0,0,0
IcoWhite=255,255,255
IcoCap=192,192,192
IcoSand=255,255,0
IcoSandDark=128,128,0

; --- the name field ------------------------------------------------------------
; Where the name sits in [MeterName], the inside of the field: this many px
; in from either side, and its line this many px down from the top -- the
; city fields' figures, for a field of their height.  It is centred in what
; is left of the width.
CityInset=2
CityDrop=2
; what is selected of it is drawn light on dark, in the title bar's brown
SelectBg=#TitleA#
SelectInk=#TitleInk#

; --- written by countdown.rs -------------------------------------------------
; the calendar (as calendar.rs writes it for the Date/Time skin too), today's
; block, the count and the date it counts to
