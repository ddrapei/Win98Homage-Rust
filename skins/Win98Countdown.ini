[MeterSelBox]
; today, in the dark block, when it is in the month on show
Meter=Shape
Hidden=#SelHide#
X=(#Pad# + 23 + #SelCol# * 23 + 2)
Y=(#Pad# + 94 + #SelRow# * 18 + 1)
Shape=Rectangle 0,0,19,16 | Fill Color #Sel# | StrokeWidth 0

[MeterRing]
; The ring round the day counted to, drawn by countdown.rs in #Ring# when
; that day is in the month on show: a pen's loop round the number, centred
; on its digits, as it would be ringed by hand -- a pixel thick, a little
; tilted, and not closed: it goes round once and a bit, widening, so that
; its end runs on past its start on the outside.  It comes after today's
; block so that, on the day itself, it is whole on top of the block rather
; than hidden under it; it never crosses a number.  Meter=Image is how a
; skin says "the program draws this"; it covers the grid, six rows of seven
; 23 x 18 cells, and the ring is kept inside it.
Meter=Image
X=(#Pad# + 23)
Y=(#Pad# + 94)
W=161
H=108

[MeterSelText]
Meter=String
MeterStyle=StyleText
Hidden=#SelHide#
X=(#Pad# + 23 + #SelCol# * 23 + 23 - 5)
Y=(#Pad# + 94 + #SelRow# * 18 + 4 + #TextDY#)
FontColor=#SelInk#
StringAlign=Right
Text=#Today#

; ---- the count box ----------------------------------------------------------

[MeterCount]
; the days left, big: "Today" on the day itself, 0 once it has gone by, and
; -- until a day is picked -- two dashes.  A reading, so #Ink# on the face,
; like the weather's temperature, and centred on the fields' middle
Meter=String
MeterStyle=StyleText
X=(#Pad# + 103)
Y=(#Pad# + 224 + #TextDY#)
StringAlign=Center
FontSize=20
StringStyle=Bold
Text=#Count#

[MeterEventDate]
; the day counted to, in full: what the count means wherever the calendar
; has been browsed to
Meter=String
MeterStyle=StyleText
X=(#Pad# + 103)
Y=(#Pad# + 255 + #TextDY#)
W=165
H=14
StringAlign=Center
ClipString=1
Text=#EventDate#

[MeterNameField]
; what the day is, in a Win98 text box with the siblings' two-ring sunken
; edge: the only white field in this box, because it is the only thing in it
; that is typed.  It is only the box; the name in it, and the click that
; starts the typing, are [MeterName]'s.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 21,273,165,20 | Fill Color #FieldBg# | StrokeWidth 0
Shape2=Rectangle 21,273,165,1 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 21,273,1,20 | Fill Color #Shadow# | StrokeWidth 0
Shape4=Rectangle 21,292,165,1 | Fill Color #Hilite# | StrokeWidth 0
Shape5=Rectangle 185,273,1,20 | Fill Color #Hilite# | StrokeWidth 0
Shape6=Rectangle 22,274,163,1 | Fill Color #DkShadow# | StrokeWidth 0
Shape7=Rectangle 22,274,1,18 | Fill Color #DkShadow# | StrokeWidth 0
Shape8=Rectangle 22,291,163,1 | Fill Color #Light# | StrokeWidth 0
Shape9=Rectangle 184,274,1,18 | Fill Color #Light# | StrokeWidth 0

[MeterName]
; The name in the field, drawn by countdown.rs and typed on where it stands,
; as the weather's city is (see field.rs).  It covers the inside of
; [MeterNameField] and nothing else: x 23..183 by y 275..290 of the frame.
; A press in it is taken by countdown.rs, which is why there is no mouse
; action here.
Meter=Image
X=(#Pad# + 23)
Y=(#Pad# + 275)
W=161
H=16

