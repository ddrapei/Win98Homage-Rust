; ---- the calendar box -------------------------------------------------------

[MeterBoxes]
; The two group boxes: the siblings' etched double ring -- a Shadow ring
; with a Hilite ring one px down-right of it -- with no legend.  They stand
; as the Date/Time skin's "Computer use" box stands in its panel: 8 px of
; bare face between the frame's bevel and the ring at either side and 5
; below, 9 between the title bar and the first top line, and 9 between the
; two boxes, as between that skin's Date box and the box under it.  Inside,
; a field sits 9 clear px in from the ring at the sides and at the top, and
; 6 above the ring at the foot.
;
; The calendar box: its ring 30..211, the fields at 41, the calendar 73..203.
Meter=Shape
X=#Pad#
Y=#Pad#
Shape=Rectangle 10,30,186,1 | Fill Color #Shadow# | StrokeWidth 0
Shape2=Rectangle 10,30,1,181 | Fill Color #Shadow# | StrokeWidth 0
Shape3=Rectangle 10,210,186,1 | Fill Color #Shadow# | StrokeWidth 0
