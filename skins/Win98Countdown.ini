; hard black outline, the sand in yellow with an olive shade on its right,
; most of it still in the top bulb, a stream through the neck and a small
; heap at the bottom.  One rectangle per run of same-coloured pixels, in
; grid coordinates, so the meter's X/Y place it inside the title bar.
